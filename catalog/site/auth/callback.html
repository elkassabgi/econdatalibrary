<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signing in…</title>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:#0f1729;color:#9ca3af}
  .m{text-align:center}
  .m strong{color:#d4a843}
  .m a{color:#d4a843}
  .ret{margin-top:.6rem;font-size:.85rem}
</style>
</head>
<body>
  <!-- Hidden until the flow is demonstrably SLOW.
       This page exists only to hand a code over and leave; on a healthy round trip it is on
       screen for a few hundred milliseconds, and painting a full-viewport dark panel for that
       long is the "page that shows up for a brief second" Ahmed reported between sites. It is
       not a page anyone is meant to read — it is a waypoint.
       So it renders nothing by default and reveals itself after 600 ms, which only happens when
       the exchange is genuinely slow or has failed. Then it is doing real work: telling the user
       something is happening and offering a way out. Fast path: invisible. Slow path: unchanged. -->
  <div class="m" id="m" hidden><p><strong>ElkassabgiData</strong><br>Completing sign-in&hellip;</p><p class="ret"><a href="/">Return to the site</a></p></div>
  <script>setTimeout(function(){var m=document.getElementById('m');if(m)m.hidden=false;},600);</script>
  <script>
  (function () {
    'use strict';
    // Two arrivals land here, told apart by window.opener.
    //
    //  1. POPUP (unchanged) — EKD.login() opened us. The SDK is alive in the opener and owns
    //     the PKCE verifier, so hand the code over and close.
    //  2. TOP-LEVEL (new)   — the silent prompt=none resume in assets/sso.js navigated this
    //     tab here. No opener, no SDK listening: anything not done here is not done at all.
    //
    // Branch 2 is what makes hf → econ work. Signing in on hfdatalibrary leaves econ's
    // localStorage empty (per-origin) and leaves no hfd_session cookie when the sign-in went
    // through the family popup — so econ's older bounce to HF's /v1/auth/sso, which reads
    // exactly that cookie, finds nothing and the visitor is shown "Sign in". Asking the IdP
    // directly is the only question that has the right answer.
    var ACCOUNTS = 'https://accounts.elkassabgidata.com';
    var API = 'https://api.hfdatalibrary.com';
    var SS = { v: 'ekd_silent_v', s: 'ekd_silent_s', r: 'ekd_silent_r', done: 'ekd_silent_done' };

    function ss(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
    function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    // Same-origin only. The value comes from sessionStorage, which is same-origin by
    // definition, but it is fed to location.replace, so it is checked rather than trusted:
    // one leading slash and no second slash rules out "//evil.com" and any absolute URL.
    function safeReturn(u) {
      if (typeof u !== 'string' || u.charAt(0) !== '/' || u.charAt(1) === '/') return '/';
      return u;
    }
    function goBack() {
      var dest = safeReturn(ss(SS.r) || '/');
      ssDel(SS.v); ssDel(SS.s); ssDel(SS.r);
      try { location.replace(dest); } catch (e) { location.href = dest; }
    }

    var p, code, state, err, hasOpener = false;
    try { p = new URLSearchParams(location.hash.slice(1)); } catch (e) { p = new URLSearchParams(''); }
    code = p.get('code') || '';
    state = p.get('state') || '';
    err = p.get('error') || '';
    try { hasOpener = !!(window.opener && !window.opener.closed); } catch (e) {}
    // Strip the code from the address bar / history immediately.
    try { history.replaceState(null, '', location.pathname); } catch (e) {}

    // ── Branch 1: popup. Unchanged, and FIRST, so the existing login flow is untouched.
    if (hasOpener) {
      var msg = { type: 'ekd_auth', code: code, state: state };
      var delivered = false;
      try { window.opener.postMessage(msg, location.origin); delivered = true; } catch (e) {}
      if (!delivered && 'BroadcastChannel' in window) {
        try { var bc = new BroadcastChannel('ekd_auth'); bc.postMessage(msg); bc.close(); } catch (e) {}
      }
      setTimeout(function () { try { window.close(); } catch (e) {} }, 200);
      return;
    }

    // ── Branch 2: top-level silent return.
    // Spend the attempt BEFORE anything can fail. sso.js only bounces when this flag is
    // absent, so setting it here is what guarantees at most one bounce per browser session —
    // including on login_required, a state mismatch, and a failed exchange. Any path that
    // leaves it unset is a redirect loop.
    ssSet(SS.done, '1');

    // login_required is the ordinary answer for a signed-out visitor, not an error.
    if (err || !code) { goBack(); return; }

    var verifier = ss(SS.v), expectState = ss(SS.s);
    // A code arriving with a state this browser did not mint belongs to someone else's flow.
    if (!verifier || !expectState || state !== expectState) { goBack(); return; }

    fetch(ACCOUNTS + '/token/exchange', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, code_verifier: verifier, client_origin: location.origin })
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.access_token) return null;
        // Stored in the SDK's own shape so EKD.getAccessToken() adopts them without knowing
        // this page exists — that is what lets download.html send Authorization: Bearer.
        if (d.refresh_token) lsSet('ekd_rt', d.refresh_token);
        lsSet('ekd_at', JSON.stringify({ t: d.access_token, e: Date.now() + (Number(d.expires_in || 900) * 1000) }));
        // edl_family is what assets/sso.js reads to decide the nav says a name rather than
        // "Sign in". Deliberately NOT edl_key: that key guards the separate one-per-session
        // bounce that FETCHES the api_key, and writing it here would short-circuit that step
        // and stop downloads working — the exact regression that was reported as "back to
        // sign-in and I can't download any more".
        lsSet('edl_family', '1');
        // The NAME IS NOT FETCHED HERE, on purpose.
        //
        // This page is visible for exactly as long as the work in front of the redirect takes,
        // and every network round trip on that path is a round trip the user watches. Fetching
        // the display name here put a SECOND request between the exchange and goBack(), which
        // is why hf -> econ flashed a "Completing sign-in…" page and econ -> hf did not: hf's
        // callback does one request, econ's did two. The name is cosmetic — it decides whether
        // the nav pill reads "Ahmed" or "Account" — so paying for it while the user stares at
        // an interstitial is the wrong trade.
        //
        // assets/sso.js backfills it on the destination page instead, off the critical path,
        // where a slow response costs nothing visible. edl_family is set here because THAT is
        // what the nav needs synchronously to stop saying "Sign in".
      })
      .catch(function () {})
      .then(function () { goBack(); });
  })();
  </script>
</body>
</html>
