# Off-machine daily check of the self-hosted econ API (docs/ECON_SELF_HOSTING_PLAN.md, code change 6;
# tools/selfhost/watch_edge.py). It runs HERE, not on the workstation it watches.
#
# Before T0 it checks that the public edge is up and (once the status route is deployed) that the deployed
# edge's FORWARD / EDGE_STATE match what this branch commits. From T0 until decommission, set the repository
# variable SELFHOST_NO_WRITES_SINCE to the T0 date: every write to the retired cloud copy (econ R2 bucket,
# econ D1 catalogue databases) then fails the run and sends an email. SELFHOST_REQUIRE_STATUS=1 makes a
# missing status route a failure (set it once the step-5 edge is deployed).
name: selfhost-watch

on:
  schedule:
    - cron: '41 6 * * *'        # off-minute: Actions crons on :00 are delayed or dropped
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the edge
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SELFHOST_NO_WRITES_SINCE: ${{ vars.SELFHOST_NO_WRITES_SINCE }}
          SELFHOST_REQUIRE_STATUS: ${{ vars.SELFHOST_REQUIRE_STATUS }}
        run: python -B tools/selfhost/watch_edge.py
