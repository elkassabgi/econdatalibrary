# tests.yml — run the test suite. It existed and nothing ran it.
#
# WHY THIS FILE EXISTS. There are 11 test files under tests/ and, until this workflow, NO
# workflow invoked pytest. `grep -rniE "pytest|unittest|tests/" .github/workflows/` returned
# nothing across all six workflows. 120 tests, green in 8.66 s locally, contributing zero
# signal to CI.
#
# That is not a hypothetical cost. bls.current_vintage() unpacked two values from a function
# returning four and raised ValueError on EVERY call for the life of a commit; the probe path
# was dead and the health gate still printed a tidy, dismissable line, because the gate reports
# from state rather than by probing (R292). A sibling of exactly that shape —
# updater/strategies/_bls_selftest.py — calls current_vintage() and would have failed
# instantly. It is wired into nothing either. A test nobody runs and a selftest nobody calls
# are the same artefact: reassurance without evidence.
#
# So the tests get their own workflow, on push and PR, where a break is attributable to the
# commit that caused it rather than surfacing days later as a data problem — the same argument
# preflight.yml already makes for itself.
#
# NOT IN THE `aqueduct-updater` CONCURRENCY GROUP, deliberately. That group is shared by
# updater-daily and updater-heavy so the two never write the single-writer state store at once
# (R5). It is `cancel-in-progress: false`, which does NOT queue: GitHub holds at most ONE
# pending run per group and a newer arrival EVICTS the one waiting. Putting a push-triggered
# workflow in there would make every push a chance to evict a scheduled updater run — the exact
# starvation measured on 2026-08-03, when updater-heavy was created at 06:30, started zero jobs,
# and was cancelled at 08:19 (R291). These tests touch no store and no state, so they need no
# lock and must not take one.

name: tests

on:
  push:
    branches: [main]
  pull_request:

# Own group, keyed by ref: a rapid second push supersedes its own earlier test run and nothing
# else. Safe to cancel here precisely because nothing in this job writes anything.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # NODE IS A TEST REQUIREMENT, NOT A CONVENIENCE. test_worker_geo_projection.py runs the
      # worker's pure TypeScript under `node --experimental-strip-types` (>= 22.6) and SKIPS
      # itself when node is absent or older — so without this step the only behavioural test
      # of the geo projection quietly does not run and the job still reports green. A test
      # that can be skipped into non-existence is not a pin (reviewer finding, 2026-08-30).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The suite imports pyarrow, requests, botocore and zstandard — the updater's own set,
      # verified by grepping every top-level import under tests/. Reusing the updater's
      # requirements file rather than a second hand-maintained list keeps one source of truth
      # (a second copy of a list is a second thing to go stale).
      - name: Install
        run: pip install --quiet -r requirements-updater.txt pytest
      - name: pytest
        run: python -m pytest tests/ -q

      # THE API CONTRACT SUITE, WHICH NOTHING RAN — the same artefact this file's header
      # describes, one directory over. `pytest tests/` does not collect api/, so the 18 tests
      # in api/test_conformance.py contributed zero signal: they pin the redistribution gate,
      # the ?lang= fallback, the CSV identity column and local-vs-HTTP bundle equality, and
      # none of it was checked on any commit. Worse than unrun, it was UNRUNNABLE — the
      # devserver fell back to the bundled data/catalog.db, which exists only in the main
      # checkout at 11.9 GB, so the suite scored 16 failures of 18 in a worktree and two of
      # its tests tried to shutil.copy that 11.9 GB file to insert one row.
      #
      # It is runnable now because api/conformance_fixture.py builds a small store (5 series,
      # 2 parquet files) whose every value is copied from the real catalogue rather than
      # invented — a fixture with made-up values tests a system that does not exist. The
      # fixture self-checks that it still exercises what the tests claim, because a fixture
      # is the one input that can satisfy an assertion by construction.
      #
      # A SEPARATE STEP, not a widened `pytest tests/ api/`: this boots a real HTTP server on
      # a free port for every module, so when it breaks it should be attributable on sight
      # rather than mixed into the 2,667-test summary line.
      - name: pytest (api contract)
        run: python -m pytest api/test_conformance.py -q

      # THE BILLING GUARD'S OWN FAULT-INJECTION PROOF, WHICH ALSO RAN NOWHERE. Sweeping for
      # the api/ defect above turned up every test-shaped file in the repo: 224 under tests/
      # and three under api/worker/test/ are collected, and exactly two were not. One
      # (scripts/edgar_pointers_test.py) is a dry-run against the local store and does not
      # belong on a runner. The other is this, and it is the one guarding the bill.
      #
      # It is NOT a pytest file — its cases are `case_*`, so `pytest` collects zero tests from
      # it and reports success, which is how a file can sit in the repo looking covered. It is
      # a script with a main() returning an exit code, so it gets a step.
      #
      # Every defect it exercises returns HTTP 200 with no error key: a truncated page that
      # undercounted by 115,000x, a short day list, a stale daily rate, a one-day rate that
      # would have projected $2,459 the morning after an incident where the median projects
      # the truth. Its own header says reading the code twice failed to find them. Free to
      # run: stdlib imports only, no network, no credentials, no D1 reads.
      #
      # Verified to FAIL before being wired up, because ALL PASS on first run is exactly when
      # a test is least trustworthy: re-opening the truncation guard, replacing the median
      # with yesterday's value, and dropping the round-UP each produce a non-zero exit.
      - name: billing guard fail-closed proof
        run: python tools/test_billing_guard_failclosed.py

      # THE WORKER'S OWN TESTS, WHICH NOTHING RAN. api/worker/test/csvStream.test.ts holds 12
      # node:test cases covering the streamed-CSV path — the code that decides whether a large
      # object is delivered or answers "Memory limit exceeded before EOF". package.json had no
      # `test` script, no workflow invoked it, and `npx vitest run` (the runner someone would
      # reach for) reports "No test suite found" because the file uses node:test. Twelve
      # passing tests contributing zero signal: this file's own header calls that "reassurance
      # without evidence", and it was true one directory over.
      #
      # A STEP, NOT A PYTEST WRAPPER. The wrapper pattern above (test_worker_geo_projection.py)
      # SKIPS itself when node is missing, which this workflow already records as the way a
      # pin can be skipped into non-existence. A step fails when node is absent.
      # INSTALL FIRST. src/csvStream.ts imports `fflate`, so running the tests before the
      # install fails with ERR_MODULE_NOT_FOUND rather than telling you anything about the
      # code. That is what the first version of this step did.
      - name: Install worker deps
        run: npm ci --prefix api/worker --no-audit --no-fund

      - name: worker tests (node:test)
        run: node --test api/worker/test/*.test.ts

      - name: worker typecheck
        run: npm run typecheck --prefix api/worker
