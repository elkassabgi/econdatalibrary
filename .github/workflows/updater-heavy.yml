# updater-heavy.yml — one runner per heavy source, for the sources that cannot
# share the nightly job.
#
# WHY THIS EXISTS NOW (and did not before):
# These sources were written off as "too big for CI, needs the workstation". That
# conclusion rested on an assumption nobody checked — that they must compete with a
# daily fleet on one runner. The cadence mix says otherwise. Of the 45 LIVE sources
# only **6 are daily**; 18 are annual and 11 monthly. The nightly job is mostly idle
# capacity, and the heavy sources are among the LEAST frequent things we run:
#
#   un_wpp         irregular   OOM at 14.93 GB peak in a shared run
#   bundesbank     monthly     OOM at 6.28 GB
#   cepii_gravity  static      OOM-class (312M rows) — barely changes at all
#   eia            daily       OOM-class; needs the whole runner to itself
#
# So each gets a MATRIX ENTRY = its own fresh runner = its own full memory and its
# own 300-minute budget. That is the part a shared job can never give: R45 recorded
# that freed memory is not reliably returned to the OS, so peaks ACCUMULATE across
# sources in one process — isolation is the fix, not a bigger cap.
#
# DELIBERATELY EXCLUDED, because isolation is not their problem:
#   ons_uk  — quarantined for a DATA defect (key grain baked into the on-disk files,
#             0 catalog rows). A bigger runner would just fail more comfortably.
#   faostat — carries the per-domain structural_unit() landmine (R44): one zero-row
#             domain vetoes the whole source. That is a code fix, not a capacity fix.
# Both belong here once their real blocker is cleared. Listing them now would mean
# claiming a fix this workflow does not deliver.
#
# SINGLE-WRITER SAFETY (§1.2 / R5): the updater state is single-writer via an ETag
# compare-and-swap, so `max-parallel: 1` is NOT a politeness setting — two heavy jobs
# pulling and pushing state concurrently would have one of them lose its write. The
# shared `aqueduct-updater` concurrency group keeps this off the nightly run's toes;
# max-parallel keeps the matrix off its own.

name: updater-heavy

on:
  schedule:
    # DAILY at 03:00 UTC — well clear of the 06:00 daily run.
    #
    # Daily, not weekly, because the matrix is not uniform: un_wpp is irregular,
    # cepii_gravity is static and bundesbank is monthly, but **eia is daily**. A
    # weekly cron would quietly under-serve eia by 6 days while looking tidy. The
    # orchestrator's own TTL due-check is what decides whether a source actually
    # runs, so on most days the infrequent three cost one cheap no-op probe each
    # and only eia does real work. Let the due-check do its job rather than
    # encoding a second, coarser schedule here that disagrees with the registry.
    - cron: '0 3 * * *'
    # SECOND ATTEMPT at 15:00 UTC, because one attempt a day is not one run a day.
    #
    # MEASURED 2026-08-03. This workflow shares the `aqueduct-updater` concurrency group
    # with updater-daily (deliberately — R5, the state store is single-writer). That group
    # is `cancel-in-progress: false`, which does NOT mean "everything eventually runs": it
    # means GitHub holds at most ONE pending run per group, and a newer arrival EVICTS the
    # one already waiting. A queued run is not a reservation.
    #
    # What that cost, in full: run 30790451118 was created 06:30, started ZERO jobs, and was
    # cancelled at 08:19 — the exact minute the next updater-daily run was created. It had
    # been waiting behind a daily run that occupied the group 04:37-08:22. So all nine heavy
    # sources got no run at all that day, and cepii_baci — restored to this matrix on
    # 2026-08-02 specifically to clear RED-UNRUN — stayed RED-UNRUN for a reason that has
    # nothing to do with cepii_baci.
    #
    # The "well clear of the 06:00 daily run" reasoning above is sound and was still not
    # enough, because it assumes cron fires on time. GitHub delays scheduled runs under load:
    # this 03:00 cron actually fired at 06:30. A fixed offset cannot dodge a variable delay.
    #
    # A second attempt is the cheap fix, and it is cheap for the reason the comment above
    # already gives: the orchestrator's TTL due-check decides what actually runs, so a second
    # daily pass costs one no-op probe per not-due source. It does not make eviction
    # impossible — nothing here can — it makes a single eviction cost hours instead of a day.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Run only this heavy source (empty = the whole matrix)'
        required: false
        type: string
      force:
        description: 'Ignore cadence + change-detection. REQUIRED to prove a fetcher (R50: without it a not-due source reports "0 unit(s) processed" and goes green having exercised nothing).'
        required: false
        type: boolean
        default: false

concurrency:
  group: aqueduct-updater      # same group as updater-daily: never both at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Builds the matrix. A job-level `if:` CANNOT reference `matrix` — GitHub rejects
  # the whole file with "Unrecognized named-value: 'matrix'", so filtering entries
  # that way takes the entire workflow down, cron included. The supported way to run
  # a subset is to compute the matrix itself and feed it through fromJSON.
  setup:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - id: pick
        run: |
          # vdem REMOVED 2026-07-31. It destroyed its runner ~90 seconds in, twice, WITH a
          # runner to itself: pyreadr loads the wide country-year RData whole and the melt to
          # ~77M long rows exceeds 16 GB before any merge starts. Isolation was never going to
          # be enough — as this workflow's own kill message says, that needs a streaming parse,
          # not more capacity. Until then it carries run_location: local and updates from the
          # workstation, where the memory exists. Leaving it here only bought a red run a day.
          # insee_sirene and cepii_baci REMOVED 2026-07-31: neither has a fetcher module at
          # updater/strategies/fetchers/<id>.py, so each burned a dedicated runner to print
          # "=== 0 unit(s) processed ===" and exit 0 — 2 of 5 heavy jobs were no-ops reporting
          # success. The zero-unit guard below now catches that, but leaving them here would
          # simply make this workflow red every night forever, and a permanently red workflow
          # is one nobody reads. They are NOT forgotten: tools/audit_schedule_coverage.py
          # reports them under "SCHEDULED ON PAPER, CANNOT RUN". Put them back the moment a
          # fetcher exists.
          # cepii_baci RESTORED 2026-08-02, on the exact condition the removal above set —
          # "Put them back the moment a fetcher exists." It does now:
          # updater/strategies/fetchers/cepii_baci.py (5,904 bytes), implemented() True, and
          # current_vintage() returns a REAL token, measured cepii_baci:4915c90e0a7efbc6 — a
          # hash over the (classification, version) pairs CEPII advertises — not the "force"
          # sentinel. It was pulled for burning a runner to print "0 unit(s) processed", which
          # is what a fetcher-less source does and this one is no longer.
          # insee_sirene stays OUT: implemented() is still False, and it is an entity registry
          # whose serving shape is an open product decision, not a missing module.
          ALL='["un_wpp","bundesbank","cepii_baci","imf_gfsbs_direct","imf_gfscofog_direct","imf_gfssfcp_direct","imf_gfssoef_direct","imf_gfssoo_direct","imf_gfsssuc_direct","imf_imts_direct","imf_pip_direct","imf_dip_direct","imf_mfsdc_direct","imf_mfsma_direct","imf_mfsofc_direct","imf_mfsfmp_direct","imf_mfsir_direct","imf_bopagg_direct","imf_psbs_direct","imf_ctot_direct","imf_sdg_direct","imf_namain_direct","imf_icsd_direct"]'
          REQ='${{ inputs.source }}'
          if [ -z "$REQ" ]; then
            echo "sources=$ALL" >> "$GITHUB_OUTPUT"
            echo "matrix: all heavy sources"
          else
            # Only dispatch a source that is actually IN the heavy set — a typo must
            # fail loudly here, not silently run nothing and report success (R50).
            case "$ALL" in
              *"\"$REQ\""*) echo "sources=[\"$REQ\"]" >> "$GITHUB_OUTPUT"; echo "matrix: $REQ" ;;
              *) echo "::error::'$REQ' is not a heavy source. Valid: $ALL"; exit 1 ;;
            esac
          fi

  heavy:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 1          # single-writer state — see header
      fail-fast: false         # one source's OOM must not cancel the others
      matrix:
        source: ${{ fromJSON(needs.setup.outputs.sources) }}
    name: ${{ matrix.source }}
    env:
      PYTHONUNBUFFERED: "1"
      R2_WRITE_ENDPOINT: ${{ secrets.R2_WRITE_ENDPOINT }}
      R2_WRITE_ACCESS_KEY_ID: ${{ secrets.R2_WRITE_ACCESS_KEY_ID }}
      R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_WRITE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      AQUEDUCT_BACKEND: r2
      ECONDL_CATALOG: ${{ github.workspace }}/data/catalog.db
      # The whole point: this source owns the runner. Give the orchestrator's own
      # budget room to finish and still leave headroom for the teardown steps —
      # being killed at the 300-minute ceiling loses the state push, the D1 syncs
      # and the digest for work that already SUCCEEDED (batch 30277746949 died
      # exactly that way at 354 min).
      AQUEDUCT_RUN_BUDGET_MIN: '240'
      # The per-unit SIGALRM defaults to 45 min — right for the shared daily run, wrong for a
      # workflow whose entire purpose is ONE giant source per runner: IMTS's honest first pull
      # was 23 min but PIP's exceeds 45, and a kill here just wastes the dedicated slot.
      # 180 keeps a hung unit bounded far below the 240-min budget + 300-min job ceiling,
      # with teardown headroom (the R66b rule: bound INSIDE with room to push state).
      AQUEDUCT_UNIT_TIMEOUT_MIN: '180'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements-updater.txt

      - name: Pull state from R2
        run: python -m updater.run --pull-state

      - name: Pull catalog.db (CSV-derive dependency)
        run: |
          python - <<'PY'
          # STREAM IT. This used to .read() the object and decompress it into one bytes
          # object with max_output_size=8<<30 — i.e. it needed the ENTIRE catalogue resident
          # while a GitHub runner has ~7 GB of RAM, and it hard-failed above 8 GiB. The
          # catalogue reaches 7.95 GiB the moment the coherence reference is refreshed to
          # match local (10,853,209 series), leaving 54 MB of headroom — so both limits were
          # about to fire on the workflow that runs the very imf_gfs*_direct sources the
          # refresh exists to fix. updater-daily.yml already streams; this is the same shape,
          # and its cost is flat in catalogue size rather than linear.
          import os, zstandard, boto3
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_WRITE_ENDPOINT"],
                            aws_access_key_id=os.environ["R2_WRITE_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_WRITE_SECRET_ACCESS_KEY"])
          os.makedirs("data", exist_ok=True)
          body = s3.get_object(Bucket="econ-data", Key="_aqueduct/catalog.db.zst")["Body"]
          with open("data/catalog.db", "wb") as fh:
              zstandard.ZstdDecompressor().copy_stream(body, fh)
          print("catalog.db bytes:", os.path.getsize("data/catalog.db"))
          PY

      - name: Run ${{ matrix.source }} (isolated runner)
        run: |
          set -o pipefail
          args="--source ${{ matrix.source }}"
          if [ "${{ inputs.force }}" = "true" ]; then args="${args} --force"; fi

          # Memory is the whole reason this source is here — sample it so an OOM is
          # PROVEN rather than inferred from a step that vanishes with no output.
          echo "runner memory at start:"; free -m | sed 's/^/    /'
          ( while :; do
              sleep 15
              echo "    [mem] $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB"}')"
            done ) &
          MEMWATCH=$!
          set +e
          python -m updater.run ${args} 2>&1 | tee /tmp/updater_out.txt
          rc=${PIPESTATUS[0]}
          set -e
          kill $MEMWATCH 2>/dev/null || true
          echo "updater exit code: ${rc}"

          # A RUN THAT PROCESSED NOTHING IS NOT A SUCCESS. This job dedicates a whole runner
          # to one source; if the orchestrator files it as "PENDING - no adapter built" and
          # exits 0, the job goes GREEN having done literally nothing. That was live: on
          # 2026-07-31 insee_sirene and cepii_baci - 2 of the 5 heavy sources - both printed
          # "=== 0 unit(s) processed ===", exited 0 and reported success, because the matrix
          # lists them but no fetcher module exists. A green heavy run was being read as "the
          # heavy sources updated" when 40% of it was a no-op.
          #
          # Cadence is NOT an exemption here: --force is available and these sources are on
          # the matrix precisely because someone wants them attempted. Zero units means the
          # dispatch was pointless and the operator needs to know.
          if [ "$rc" = "0" ] && grep -qE '^=== 0 unit\(s\) processed ===' /tmp/updater_out.txt; then
            if grep -q 'NOT DUE' /tmp/updater_out.txt; then
              # NOT a failure. The cron does not pass --force, so a source whose cadence has
              # not elapsed correctly processes nothing. Until orchestrate announced that
              # skip it printed NOTHING, making a healthy cadence skip indistinguishable in
              # the log from "this source has no fetcher at all" - so this guard, added hours
              # earlier the same night, would have failed the job for behaving correctly on
              # the next quiet night. Say so and pass.
              echo "::notice::${{ matrix.source }} processed 0 units because its cadence has not elapsed. Not a failure; dispatch with force=true to override."
            elif grep -q 'no adapter built' /tmp/updater_out.txt; then
              echo "::error::${{ matrix.source }} processed 0 units - NO FETCHER MODULE EXISTS (updater/strategies/fetchers/${{ matrix.source }}.py). It is scheduled on paper only; this job has been burning a runner to do nothing. Build the fetcher or take it off the matrix."
            else
              echo "::error::${{ matrix.source }} processed 0 units and still exited 0. A dedicated heavy run that updates nothing must not report success - check the due-check, the lease and the live tier."
            fi
            # Only the genuinely-wrong cases fail; a cadence skip already passed above.
            if ! grep -q 'NOT DUE' /tmp/updater_out.txt; then rc=1; fi
          fi

          # A DEDICATED RUN WHOSE ONE SOURCE FAILED IS NOT A SUCCESS. The zero-unit guard above
          # only catches "0 unit(s) processed". It misses the shape that actually occurred on
          # 2026-08-01: the unit RAN, transient-failed, produced 0 observations, and the
          # updater exited 0 because a non-live source's failure does not fail the whole run -
          # which is right for the shared daily job and wrong here, where the entire point of
          # the job is this one source. Four of six GFS jobs reported SUCCESS that morning
          # while merging nothing (OverflowError / expat out-of-memory on the big flows).
          #
          # Reads the orchestrator's own per-unit summary line rather than guessing, and names
          # the status so the failure is actionable from the job title alone.
          #
          # `partial` is DELIBERATELY not in this list. It is the designed honest state for
          # "some sub-units failed while the rest merged" - bis, bls, eia and faostat are
          # routinely partial while moving hundreds of millions of rows. Failing on it would
          # make this workflow permanently red, and a permanently red workflow is one nobody
          # reads: the same cry-wolf trap as the irregular-cadence lateness clock. The health
          # board and the daily digest already carry partials.
          if [ "$rc" = "0" ]; then
            bad=$(grep -E "^\s+(transient_fail|broken_adapter|timeout)\s+${{ matrix.source }}/" /tmp/updater_out.txt | head -1 || true)
            if [ -n "$bad" ]; then
              echo "::error::${{ matrix.source }} did not succeed: ${bad}. This job exists to run that one source, so its failure is the job's failure - the shared daily run tolerates it, a dedicated runner must not."
              rc=1
            fi
          fi
          if [ "$rc" = "137" ] || [ "$rc" = "143" ]; then
            echo "::error::${{ matrix.source }} was KILLED (exit ${rc}) — still out of memory WITH a runner to itself. Isolation was not enough; this source needs a real fix (streaming parse or chunked merge), not more capacity."
          fi
          exit $rc

      - name: Push state to R2 (compare-and-swap + dated backup)
        run: python -m updater.run --push-state

      - name: Sync freshness to D1
        run: |
          npm ci --prefix api/worker --no-audit --no-fund
          python core/sync_state_d1.py

      - name: Sync new catalog series to D1
        continue-on-error: true
        run: python core/sync_catalog_d1.py
