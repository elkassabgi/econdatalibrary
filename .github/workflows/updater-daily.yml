# updater-daily.yml — THE scheduled entrypoint for the Aqueduct updater.
#
# WHY (UPDATER_BUILD_PLAN.md §4.3): one orchestrated daily run; the TTL-by-cost
# due-check inside updater/orchestrate.py decides what is actually due, so there
# is deliberately NO per-cadence workflow zoo (monthly sources simply aren't due
# 29 days out of 30). Giants and large-cost sources get their own workflows for
# disk/time isolation and are NOT run here.
#
# Honesty rules (§5) this file enforces at the CI layer:
#   - concurrency group "aqueduct-updater" with cancel-in-progress:false =
#     single-writer belt #1 (the state ETag compare-and-swap in --push-state is
#     the real cross-writer guard, §1.2).
#   - updater.health --fail-past-2x-sla exits nonzero -> red run -> GH notification.
#   - Heartbeat commit of ops/last_run.txt every real run: GitHub silently
#     disables crons after 60 days without repo activity; the heartbeat is the
#     cron-death guard (§4.3). If the heartbeat push fails, the run is RED.
#   - dry_run dispatches skip every write step (state push, D1 sync, heartbeat)
#     so a dry run truly writes nothing (test T-3).

name: updater-daily

on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC; weekend runs resolve to honest no_change probes
  workflow_dispatch:
    inputs:
      source:
        description: 'Run only this registry source id (empty = everything due)'
        required: false
        type: string
      dry_run:
        description: 'Print the plan; write nothing (no R2, no D1, no heartbeat)'
        required: false
        type: boolean
        default: false

concurrency:
  group: aqueduct-updater
  cancel-in-progress: false

# Least privilege (public repo): the workflow-wide token is READ-only, so the long
# `pip install` + fetch steps — which run alongside the R2/Cloudflare/FRED secrets —
# cannot write to the repo. The heartbeat commit needs write, so it elevates on its
# own step below via a scoped token rather than granting write to everything.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Write is needed only by the heartbeat step, which injects the token itself.
    permissions:
      contents: write
    env:
      R2_WRITE_ENDPOINT: ${{ secrets.R2_WRITE_ENDPOINT }}
      R2_WRITE_ACCESS_KEY_ID: ${{ secrets.R2_WRITE_ACCESS_KEY_ID }}
      R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_WRITE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      AQUEDUCT_BACKEND: r2
      # Rollout perimeter: scheduled runs execute ONLY live: true sources.
      # (Learned from run 28682266857: without this, every due source with an
      # adapter ran on one 14 GB runner until SIGTERM.) A manual dispatch with
      # an explicit `source` input still runs a non-live source for its
      # pre-go-live delta proof.
      AQUEDUCT_LIVE_ONLY: '1'
      # CSV derive (contract step 5) resolves catalog ids against this db —
      # pulled from R2 each run (plan §1.1 step 5 / O-9).
      ECONDL_CATALOG: ${{ github.workspace }}/data/catalog.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave the GITHUB_TOKEN in .git/config for the rest of the job:
          # every later step (pip install, third-party fetches) would otherwise run
          # beside a usable repo token. The heartbeat step re-auths explicitly.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements-updater.txt

      - name: Pull state from R2
        # Downloads _aqueduct/state.db.zst, decompresses to data/_aqueduct/state.db,
        # records the object ETag for the compare-and-swap at push time (§1.2).
        run: python -m updater.run --pull-state

      - name: Pull catalog.db (CSV-derive dependency, plan O-9)
        # ~0.5 GB zstd download; the derive step maps changed series to catalog
        # ids and projects their CSVs — without the catalog the run would be
        # honest-partial every day. Skipped on dry runs (no derive happens).
        if: ${{ inputs.dry_run != true }}
        run: |
          python - <<'PY'
          import os, zstandard
          from core import r2_util
          c = r2_util.client()
          obj = c.get_object(Bucket='econ-data', Key='_aqueduct/catalog.db.zst')
          os.makedirs('data', exist_ok=True)
          with open('data/catalog.db', 'wb') as out:
              zstandard.ZstdDecompressor().copy_stream(obj['Body'], out)
          print('catalog.db bytes:', os.path.getsize('data/catalog.db'))
          PY

      - name: Run updater
        # Inputs are passed via env (not inlined into the command) so a crafted
        # 'source' value cannot inject shell syntax, and so the boolean dry_run
        # never renders as a literal "false" argument (GH expression pitfall).
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=""
          # INPUT_SOURCE may be a single id or a comma/space-separated LIST (batch proof of
          # several sources in one run). Split it into repeated --source flags. Kept
          # injection-safe: env var (never inlined), globbing disabled during the split, and
          # every token validated to [a-z0-9_] so a crafted value cannot become a flag or path.
          if [ -n "${INPUT_SOURCE}" ]; then
            set -f
            for s in $(printf '%s' "${INPUT_SOURCE}" | tr ',' ' '); do
              case "$s" in
                "") ;;
                *[!a-z0-9_]*) echo "ignoring invalid source token: $s" >&2 ;;
                *) args="${args} --source ${s}" ;;
              esac
            done
            set +f
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args="${args} --dry-run"; fi
          python -m updater.run ${args}

      - name: Push state to R2 (compare-and-swap + dated backup)
        # Aborts loudly (exit 2) if the remote ETag moved — another writer won;
        # never blind last-writer-wins (§1.2). Also PUTs the dated backup under
        # _aqueduct/backups/.
        if: ${{ inputs.dry_run != true }}
        run: python -m updater.run --push-state

      - name: Sync freshness to D1
        # npm ci first so `npx wrangler` resolves the version PINNED in
        # api/worker/package.json (^3.78.0) instead of floating to latest —
        # required by plan §1.3.
        if: ${{ inputs.dry_run != true }}
        run: |
          npm ci --prefix api/worker --no-audit --no-fund
          python core/sync_state_d1.py

      - name: Health gate (fail past 2x SLA)
        # Exit 1 -> red run -> GH notification. D1 keeps serving the true stale
        # date — the public endpoint never lies to hide our failure (§5.3).
        run: python -m updater.health --fail-past-2x-sla

      - name: Daily digest email (morning report, like hfdatalibrary's)
        # Runs even when earlier steps failed so a broken morning is REPORTED,
        # not silent. Needs the RESEND_API_KEY repo secret; without it the step
        # prints the digest to the log and skips sending (loudly).
        if: ${{ always() && inputs.dry_run != true }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_STATUS: ${{ job.status }}
          # Recipient is a secret so no personal address sits in a public repo.
          # NOTE: until the DIGEST_TO repo secret is created this resolves to "",
          # and send_digest.py falls back to admin@hfdatalibrary.com.
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python updater/send_digest.py

      - name: Heartbeat commit (cron-death guard)
        # GitHub disables schedules after 60 days of repo inactivity; nothing
        # else ever commits at steady state. Every real run (scheduled or manual
        # non-dry) commits a one-line run-id heartbeat. Any failure in this
        # chain — including the push — makes the run RED (bash -e).
        #
        # RACE-PROOF (2026-07-10, after run 28979036246 went red): a queued run
        # checks out the sha pinned at TRIGGER time, so by heartbeat time main
        # may already carry a sibling run's heartbeat — the old commit-then-
        # `pull --rebase` pattern then hit a guaranteed content conflict on this
        # single-line file. A heartbeat is last-writer-wins by definition, so
        # instead: rebuild it on a FRESH origin tip immediately before each push
        # attempt (reset --hard is safe here — the updater persists to R2/D1,
        # never the repo tree), retry x3, and only then go RED.
        if: ${{ inputs.dry_run != true }}
        # The repo token is injected ONLY into this step (checkout ran with
        # persist-credentials:false), so the earlier pip-install / third-party-fetch
        # steps never have a usable write token sitting beside the R2 + Cloudflare
        # secrets. Matters now that the repo is public.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # checkout ran with persist-credentials:false, so `origin` carries NO auth and an
          # unauthenticated fetch against this PRIVATE repo fails outright (under `bash -e`
          # that aborts the step on attempt 1 and the push below is never reached). Both the
          # fetch AND the push must therefore use the explicitly-injected token, and we reset
          # to FETCH_HEAD rather than origin/<branch> so we don't depend on refs/remotes being
          # updated by an authenticated fetch.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git fetch "$REMOTE" "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            mkdir -p ops
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) run=${{ github.run_id }}" > ops/last_run.txt
            git add ops/last_run.txt
            git commit -m "heartbeat: run ${{ github.run_id }}"
            if git push "$REMOTE" HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "heartbeat push raced another writer (attempt ${attempt}); rebuilding on fresh origin"
          done
          echo "heartbeat push failed after 3 attempts" >&2
          exit 1
