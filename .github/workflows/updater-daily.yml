# updater-daily.yml — THE scheduled entrypoint for the Aqueduct updater.
#
# WHY (UPDATER_BUILD_PLAN.md §4.3): one orchestrated daily run; the TTL-by-cost
# due-check inside updater/orchestrate.py decides what is actually due, so there
# is deliberately NO per-cadence workflow zoo (monthly sources simply aren't due
# 29 days out of 30). Giants and large-cost sources get their own workflows for
# disk/time isolation and are NOT run here.
#
# Honesty rules (§5) this file enforces at the CI layer:
#   - concurrency group "aqueduct-updater" with cancel-in-progress:false =
#     single-writer belt #1 (the state ETag compare-and-swap in --push-state is
#     the real cross-writer guard, §1.2).
#   - updater.health --fail-past-2x-sla exits nonzero -> red run -> GH notification.
#   - Heartbeat commit of ops/last_run.txt every real run: GitHub silently
#     disables crons after 60 days without repo activity; the heartbeat is the
#     cron-death guard (§4.3). If the heartbeat push fails, the run is RED.
#   - dry_run dispatches skip every write step (state push, D1 sync, heartbeat)
#     so a dry run truly writes nothing (test T-3).

name: updater-daily

on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC; weekend runs resolve to honest no_change probes
  workflow_dispatch:
    inputs:
      source:
        description: 'Run only this registry source id (empty = everything due)'
        required: false
        type: string
      dry_run:
        description: 'Print the plan; write nothing (no R2, no D1, no heartbeat)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Ignore cadence + change-detection. REQUIRED to prove a fetcher: without it a not-due source reports "0 unit(s) processed" and the run goes GREEN having exercised nothing.'
        required: false
        type: boolean
        default: false

concurrency:
  group: aqueduct-updater
  cancel-in-progress: false

# Least privilege (public repo): the workflow-wide token is READ-only, so the long
# `pip install` + fetch steps — which run alongside the R2/Cloudflare/FRED secrets —
# cannot write to the repo. The heartbeat commit needs write, so it elevates on its
# own step below via a scoped token rather than granting write to everything.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Write is needed only by the heartbeat step, which injects the token itself.
    permissions:
      contents: write
    env:
      # Stream Python output instead of block-buffering it. Without this, a step that is
      # KILLED (OOM -> SIGTERM, which GitHub surfaces as "The operation was canceled")
      # loses everything it printed, leaving a log that ends at the env dump. Three ons_uk
      # investigations ran blind against exactly that empty log; a buffered process that
      # dies tells you nothing about WHERE it died.
      PYTHONUNBUFFERED: "1"
      R2_WRITE_ENDPOINT: ${{ secrets.R2_WRITE_ENDPOINT }}
      R2_WRITE_ACCESS_KEY_ID: ${{ secrets.R2_WRITE_ACCESS_KEY_ID }}
      R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_WRITE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # comtrade moved to the SUBSCRIPTION endpoint (dddeebf) because the old public/v1/preview
      # tier caps a response at 500 records and cannot carry the 2014-2025 history. The repo
      # secret already existed; this job simply never passed it, so the first cloud run after
      # the repair reported: "FATAL: COMTRADE_API_KEY missing - refusing to fall back to the
      # 500-record preview endpoint" and the source transient-failed. The refusal is correct -
      # falling back would have silently republished a truncated store - but the key has to
      # reach the process for the source to work at all.
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      AQUEDUCT_BACKEND: r2
      # Rollout perimeter: scheduled runs execute ONLY live: true sources.
      # (Learned from run 28682266857: without this, every due source with an
      # adapter ran on one 14 GB runner until SIGTERM.) A manual dispatch with
      # an explicit `source` input still runs a non-live source for its
      # pre-go-live delta proof.
      AQUEDUCT_LIVE_ONLY: '1'
      # WID ships one ~17 MB CSV per country, 424 of them (~7 GB). At its 180-min
      # default a first pass would eat three quarters of the 240-min run and starve
      # every other due source. 60 min spreads it over ~3 nights instead.
      # SAFE ONLY BECAUSE THE FETCHER RESUMES (ledger R130): it records each
      # country's published vintage once merged and skips it next time. Before that
      # fix the loop restarted at country 1 every run, so a SMALLER budget reached
      # fewer countries and then stalled there permanently. If that marker is ever
      # removed, remove this cap with it.
      AQUEDUCT_WID_BUDGET_MIN: '60'
      # CSV derive (contract step 5) resolves catalog ids against this db —
      # pulled from R2 each run (plan §1.1 step 5 / O-9).
      ECONDL_CATALOG: ${{ github.workspace }}/data/catalog.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave the GITHUB_TOKEN in .git/config for the rest of the job:
          # every later step (pip install, third-party fetches) would otherwise run
          # beside a usable repo token. The heartbeat step re-auths explicitly.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements-updater.txt

      - name: Pull state from R2
        # Downloads _aqueduct/state.db.zst, decompresses to data/_aqueduct/state.db,
        # records the object ETag for the compare-and-swap at push time (§1.2).
        # id: the push step below runs on always() and needs to know THIS step
        # succeeded — without a recorded ETag the CAS would refuse and exit 2, turning
        # a pull failure into a second, misleading failure.
        id: pull_state
        run: python -m updater.run --pull-state

      - name: Pull catalog.db (CSV-derive dependency, plan O-9)
        # ~0.5 GB zstd download; the derive step maps changed series to catalog
        # ids and projects their CSVs — without the catalog the run would be
        # honest-partial every day. Skipped on dry runs (no derive happens).
        if: ${{ inputs.dry_run != true }}
        run: |
          python - <<'PY'
          import os, zstandard
          from core import r2_util
          c = r2_util.client()
          obj = c.get_object(Bucket='econ-data', Key='_aqueduct/catalog.db.zst')
          os.makedirs('data', exist_ok=True)
          with open('data/catalog.db', 'wb') as out:
              zstandard.ZstdDecompressor().copy_stream(obj['Body'], out)
          print('catalog.db bytes:', os.path.getsize('data/catalog.db'))
          PY

      - name: Run updater
        # Inputs are passed via env (not inlined into the command) so a crafted
        # 'source' value cannot inject shell syntax, and so the boolean dry_run
        # never renders as a literal "false" argument (GH expression pitfall).
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=""
          # INPUT_SOURCE may be a single id or a comma/space-separated LIST (batch proof of
          # several sources in one run). Split it into repeated --source flags. Kept
          # injection-safe: env var (never inlined), globbing disabled during the split, and
          # every token validated to [a-z0-9_] so a crafted value cannot become a flag or path.
          if [ -n "${INPUT_SOURCE}" ]; then
            set -f
            for s in $(printf '%s' "${INPUT_SOURCE}" | tr ',' ' '); do
              case "$s" in
                "") ;;
                *[!a-z0-9_]*) echo "ignoring invalid source token: $s" >&2 ;;
                *) args="${args} --source ${s}" ;;
              esac
            done
            set +f
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args="${args} --dry-run"; fi
          # --force is what makes a dispatch an actual PROOF. A plain --source run still
          # honours the cadence gate, so proving a source that isn't due prints
          # "0 unit(s) processed" and the run goes green having exercised no fetcher code
          # at all — a green light that means nothing (R35: configured is not running).
          if [ "${INPUT_FORCE}" = "true" ]; then args="${args} --force"; fi

          # Sample memory alongside the run so an OOM kill is PROVEN, not inferred. A step
          # that vanishes with no output and no exit code is indistinguishable from a
          # network hang, a rate-limit block, or a crash -- and guessing between them cost
          # three ons_uk runs. This prints total/available MB every 15s and reports the
          # real exit status (137=SIGKILL/OOM, 143=SIGTERM) instead of swallowing it.
          echo "runner memory at start:"; free -m | sed 's/^/    /'
          ( while :; do
              sleep 15
              echo "    [mem] $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB"}')"
            done ) &
          MEMWATCH=$!
          set +e
          python -m updater.run ${args}
          rc=$?
          set -e
          kill $MEMWATCH 2>/dev/null || true
          echo "updater exit code: ${rc}"
          if [ "$rc" = "137" ] || [ "$rc" = "143" ]; then
            echo "::error::updater was KILLED (exit ${rc}) — out of memory on the runner, not a source failure"
          fi
          exit $rc

      - name: Push state to R2 (compare-and-swap + dated backup)
        id: push_state
        # Aborts loudly (exit 2) if the remote ETag moved — another writer won;
        # never blind last-writer-wins (§1.2). Also PUTs the dated backup under
        # _aqueduct/backups/.
        #
        # always() ADDED 2026-07-30. A bare `if:` still ANDs GitHub's implicit success(),
        # so ANY non-zero exit from "Run updater" skipped this push and threw away the
        # whole run's state — every source that HAD been checked lost its advanced
        # checked_at/last_success and rotted toward RED-SLA despite having been probed.
        # The updater is designed to exit non-zero on a live-tier failure while still
        # having done honest work on the other ~130 sources; discarding that is the
        # opposite of the honest-status contract.
        #
        # Gated on the PULL succeeding, not on the updater succeeding: push_state()'s
        # compare-and-swap keys on the ETag recorded by --pull-state, so without a
        # successful pull it would refuse and exit 2 — turning one failure into two.
        # That CAS (plus its "state.db does not exist" guard) is what makes always()
        # safe here: it is structurally incapable of overwriting a newer remote state.
        if: ${{ always() && steps.pull_state.outcome == 'success' && inputs.dry_run != true }}
        run: python -m updater.run --push-state

      - name: Sync freshness to D1
        # npm ci first so `npx wrangler` resolves the version PINNED in
        # api/worker/package.json (^3.78.0) instead of floating to latest —
        # required by plan §1.3.
        #
        # always() ADDED 2026-07-30, gated on the state push having landed. The updater
        # exits non-zero on a live-tier failure while still having honestly refreshed the
        # other sources; skipping this left D1 — and therefore the public freshness the
        # site shows — describing a run that did happen as though it had not. Gated on
        # push_state so we never publish freshness the state store has not committed.
        if: ${{ always() && steps.push_state.outcome == 'success' && inputs.dry_run != true }}
        run: |
          npm ci --prefix api/worker --no-audit --no-fund
          python core/sync_state_d1.py

      - name: Sync new catalog series to D1
        # Freshness alone is not enough: sync_state_d1 pushes unit_state/source_state
        # and explicitly never touches the catalog, so a NEWLY DERIVED series landed
        # in R2 (hosted, downloadable by id) but never appeared in /v1/catalog. That
        # gap stranded 31,259 series before it was measured on 2026-07-27 — boe was
        # serving 21 of its 30,674. The orchestrator records each derived id; this
        # upserts exactly those rows. continue-on-error because the data publish has
        # already succeeded by this point and the ids stay queued in
        # pending_catalog_sync.txt, so a transient D1 failure costs a day of
        # discoverability, never a day of data.
        #
        # always() ADDED 2026-07-30, same reasoning as the freshness sync above: a
        # non-zero updater exit does not un-derive the series that WERE derived, and
        # skipping this strands them exactly the way the 31,259 were. Already
        # continue-on-error, so running it on a failed run cannot add a second failure.
        if: ${{ always() && steps.push_state.outcome == 'success' && inputs.dry_run != true }}
        continue-on-error: true
        run: python core/sync_catalog_d1.py

      - name: Relay staleness (the failure the health gate CANNOT see)
        # A DBnomics-relayed source that is frozen UPSTREAM reports no_change every day,
        # succeeds every day, and serves data years out of date. Our change signal is
        # DBnomics' own dataset hash, so "nothing changed" is true of the relay and false of the
        # publisher — a frozen relay and a genuinely quiet publisher produce byte-identical
        # evidence on our side, and the health gate below is blind to it by construction.
        #
        # Measured 2026-08-02: 98 of 101 relayed sources stale past 180 days, 1,481,345 series;
        # the FAO block last re-indexed 2022-04-05, i.e. 1,580 days. None of that was visible
        # anywhere in CI, which is why it went unnoticed for years.
        #
        # REPORTS ONLY, deliberately. Migrating a source off the relay re-keys its series (the
        # flow id is embedded in every key), so the call belongs to a human; this makes the
        # number impossible to miss and changes nothing on its own. `|| true` keeps a DBnomics
        # probe outage from reddening a run whose actual updating was fine.
        if: ${{ always() }}
        run: python tools/audit_dbnomics_staleness.py --days 180 || true

      - name: Health gate (fail past 2x SLA)
        # Exit 1 -> red run -> GH notification. D1 keeps serving the true stale
        # date — the public endpoint never lies to hide our failure (§5.3).
        run: python -m updater.health --fail-past-2x-sla

      - name: Daily digest email (morning report, like hfdatalibrary's)
        # Runs even when earlier steps failed so a broken morning is REPORTED,
        # not silent. Needs the RESEND_API_KEY repo secret; without it the step
        # prints the digest to the log and skips sending (loudly).
        if: ${{ always() && inputs.dry_run != true }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_STATUS: ${{ job.status }}
          # Recipient is a secret so no personal address sits in a public repo.
          # NOTE: until the DIGEST_TO repo secret is created this resolves to "",
          # and send_digest.py falls back to admin@hfdatalibrary.com.
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python updater/send_digest.py

      - name: Heartbeat commit (cron-death guard)
        # GitHub disables schedules after 60 days of repo inactivity; nothing
        # else ever commits at steady state. Every real run (scheduled or manual
        # non-dry) commits a one-line run-id heartbeat. Any failure in this
        # chain — including the push — makes the run RED (bash -e).
        #
        # RACE-PROOF (2026-07-10, after run 28979036246 went red): a queued run
        # checks out the sha pinned at TRIGGER time, so by heartbeat time main
        # may already carry a sibling run's heartbeat — the old commit-then-
        # `pull --rebase` pattern then hit a guaranteed content conflict on this
        # single-line file. A heartbeat is last-writer-wins by definition, so
        # instead: rebuild it on a FRESH origin tip immediately before each push
        # attempt (reset --hard is safe here — the updater persists to R2/D1,
        # never the repo tree), retry x3, and only then go RED.
        #
        # always() ADDED 2026-07-30. This step IS the cron-death guard: GitHub disables
        # a schedule after 60 days without repo activity, and the heartbeat is what
        # supplies that activity. A bare `if:` still ANDs the implicit success(), so a
        # run of failures — exactly the state that most needs the schedule to keep
        # firing — silenced the very guard protecting it. abs killed three runs in a row
        # this morning; sixty of those and the cron switches itself off. A guard that
        # only runs when nothing is wrong is not a guard.
        if: ${{ always() && inputs.dry_run != true }}
        # The repo token is injected ONLY into this step (checkout ran with
        # persist-credentials:false), so the earlier pip-install / third-party-fetch
        # steps never have a usable write token sitting beside the R2 + Cloudflare
        # secrets. Matters now that the repo is public.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # checkout ran with persist-credentials:false, so `origin` carries NO auth and an
          # unauthenticated fetch against this PRIVATE repo fails outright (under `bash -e`
          # that aborts the step on attempt 1 and the push below is never reached). Both the
          # fetch AND the push must therefore use the explicitly-injected token, and we reset
          # to FETCH_HEAD rather than origin/<branch> so we don't depend on refs/remotes being
          # updated by an authenticated fetch.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git fetch "$REMOTE" "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            mkdir -p ops
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) run=${{ github.run_id }}" > ops/last_run.txt
            git add ops/last_run.txt
            git commit -m "heartbeat: run ${{ github.run_id }}"
            if git push "$REMOTE" HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "heartbeat push raced another writer (attempt ${attempt}); rebuilding on fresh origin"
          done
          echo "heartbeat push failed after 3 attempts" >&2
          exit 1
