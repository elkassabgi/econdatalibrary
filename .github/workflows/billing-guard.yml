# billing-guard.yml — daily D1 rows-read meter check (Ahmed 2026-08-17: "i already
# had one but its ineffective").
#
# WHY. The 2026-08-13..15 D1 incident billed ~$175 before the INVOICE was the first
# alarm — Cloudflare's dashboard notification never fired usefully on rows-read.
# This workflow is the durable replacement: it measures the actual meter daily via
# `wrangler d1 insights --timePeriod 1d` across all three databases (econ-catalog,
# econ-catalog-climate, hfdatalibrary-db) and alerts through TWO independent paths:
#   - over ALERT (5B rows/day): tools/billing_guard.py exits 1 -> RED workflow ->
#     GitHub's failed-workflow email, PLUS a Resend alert email with the numbers.
#   - over WARN (2B rows/day): green run, Resend warning email.
# Thresholds are measured, not guessed: healthy steady state is ~1B/day total
# (econ ~200-400M + hf download_log aggregates ~600M, task #134); the incident
# peaked at 130B/day. $1 per billion rows read.
#
# Runs at an off-minute (Actions crons on :00 are heavily delayed/dropped) after
# 12:00Z so the "1d" window covers a full UTC day of the daily updater's traffic.

name: billing-guard

on:
  schedule:
    # EVERY 30 MINUTES, standing order from Ahmed 2026-09-01 after the 08-31 spike reached
    # him through his INVOICE: "you need to run a permanent check every 30 minutes to make
    # sure that these costs dont happen again."
    #
    # Daily was not enough twice over. It ran once at 13:23 UTC, so a leak starting after it
    # had ~24 h to run; and the 08-31 breach (D1 2,805,188,474 reads, 11,412,906 writes; R2
    # class-A 2,880,378) sat in the WARN band, whose only delivery was a Resend email that
    # has never been configured — so the run went GREEN. Both are fixed: every breach now
    # reddens the workflow (GitHub's failure email needs no secret), and the guard alarms on
    # TODAY'S PARTIAL numbers as well as the last complete day, because a complete-day alarm
    # is up to 24 h late however often it runs.
    #
    # Off-minutes deliberately: Actions crons scheduled on :00 are heavily delayed or dropped.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      # WITHOUT THIS THE GUARD IS BLIND IN CI, AND REASSURING. It was never passed, so every
      # scheduled run fell back to `wrangler d1 insights` (which this file's own docstring
      # records as ~10x low) and priced R2 operations, Workers and the storage MEAN at zero.
      # Measured 2026-09-01, the same minute, same code: locally with the token it reported
      # $328/mo and exited 1 on three breaches; here it reported "PARTIAL MONTH FLOOR ~= $13/mo"
      # and exited 0. A monitor that says $13 when the bill is $328 is worse than none.
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
      # AND THE ACCOUNT ID, which is the OTHER half of the same gate. account_analytics()
      # refuses on `not tok or not acct`, and _account_id() used to read only
      # R2_WRITE_ENDPOINT, falling back to the repo `.env` — which is gitignored and does not
      # exist on a runner. So on 2026-09-02, minutes after CF_ANALYTICS_TOKEN was added to the
      # repo secrets, run 33669058808 still printed "CF_ANALYTICS_TOKEN is not set". Both
      # names are passed now: CLOUDFLARE_ACCOUNT_ID above is the canonical one, and this is
      # the fallback if its stored value is ever not a bare 32-hex tag.
      R2_WRITE_ENDPOINT: ${{ secrets.R2_WRITE_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci so `npx wrangler` resolves the version PINNED in
      # api/worker/package.json instead of floating to latest (plan §1.3).
      - name: Install pinned wrangler
        run: npm ci --prefix api/worker --no-audit --no-fund

      - name: Measure D1 rows read (24h, all databases)
        # billing_guard.py runs `npx wrangler d1 insights` per database; npx must
        # resolve against the api/worker install, so run from that prefix on PATH.
        run: |
          export PATH="$PWD/api/worker/node_modules/.bin:$PATH"
          python tools/billing_guard.py
