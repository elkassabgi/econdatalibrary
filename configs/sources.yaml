# ============================================================================
# Econ-Fin Data Library -- SOURCE & LICENSE REGISTRY  (the legal backbone)
# ----------------------------------------------------------------------------
# Decisions locked 2026-06-01:
#   HOST  = all GREEN + kept YELLOW (IMF, ECB/Frankfurter, BIS*, DBnomics*)
#   DROP  = CoinGecko, Alternative.me            (see `dropped:` below)
#   CARVE = Eurostat / OWID / FRED               (see `carve_outs:` below)
#   * BIS = non-commercial only;  DBnomics = per-series license passthrough.
#
# `reservable: true` is the gate -- core/licenses.py refuses to publish anything
# whose license class is not re-serveable. Re-verify every license before launch.
# ============================================================================

licenses:
  us-public-domain:     {reservable: true,  commercial_ok: true,  attribution: requested}
  cc-by-4.0:            {reservable: true,  commercial_ok: true,  attribution: required}
  cc0:                  {reservable: true,  commercial_ok: true,  attribution: false}
  ogl-uk-3.0:           {reservable: true,  commercial_ok: true,  attribution: required}
  etalab-2.0:           {reservable: true,  commercial_ok: true,  attribution: required}
  statcan-open:         {reservable: true,  commercial_ok: true,  attribution: required}
  ecb-attrib-nomodify:  {reservable: true,  commercial_ok: true,  attribution: required, no_modify: true}
  imf-terms:            {reservable: true,  commercial_ok: true,  attribution: required, disclose_free: true}
  bis-attrib-nc:        {reservable: true,  commercial_ok: false, attribution: required}   # NON-COMMERCIAL
  zillow-research:      {reservable: true,  commercial_ok: true,  attribution: required}    # "Data Provided by Zillow Group"
  defillama-open:       {reservable: true,  commercial_ok: true,  attribution: required}
  dbnomics-passthrough: {reservable: per_series, note: "inherit each provider's license at ingest"}
  # NonCommercial + granted licenses (attribution is a binding condition — the .csv
  # citation header + metadata surface these flags; see REDISTRIBUTION_COMPLIANCE.md).
  cc-by-nc-sa-4.0:      {reservable: true,  commercial_ok: false, attribution: required, no_modify: false, url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"}   # IEP gpi/gti/ppi/etr
  cc-by-nc-sa-3.0-igo:  {reservable: true,  commercial_ok: false, attribution: required, no_modify: true,  url: "https://creativecommons.org/licenses/by-nc-sa/3.0/igo/"}  # WHO GHO — NonCommercial (flag was backwards)
  cc-by-sa-4.0:         {reservable: true,  commercial_ok: true,  attribution: required, no_modify: false, url: "https://creativecommons.org/licenses/by-sa/4.0/"}   # ShareAlike allows commercial (both flags were backwards)
  cc-by-3.0:            {reservable: true,  commercial_ok: true,  attribution: required, url: "https://creativecommons.org/licenses/by/3.0/"}
  nlod-2.0:             {reservable: true,  commercial_ok: true,  attribution: required, url: "https://data.norge.no/nlod/en/2.0"}   # Statistics Norway requires credit
  whr-granted:          {reservable: true,  commercial_ok: false, attribution: required, url: "https://worldhappiness.report/data-sharing/"}   # WHR/Gallup: copyrighted, publicly available with attribution (granted 2026-07)

# ---------------------------------------------------------------------------
# SOURCES WE HOST (cache on R2 + re-serve). schedule = per-source cadence.
# ---------------------------------------------------------------------------
  # --- Stage 0b: verified-license classes (verbatim audit 2026-07-14) ---
  cc-by-3.0-igo: {reservable: true, commercial_ok: true, attribution: required, no_modify: false, url: "https://creativecommons.org/licenses/by/3.0/igo/"}  # Stage 0b verified (CC BY 3.0 IGO)
  verified-attribution: {reservable: true, commercial_ok: true, attribution: required, no_modify: false, url: ""}  # Stage 0b verified (Verified: redistribution permitted with attribution (see source terms_url))
  verified-nc: {reservable: true, commercial_ok: false, attribution: required, no_modify: false, url: ""}  # Stage 0b verified (Verified: non-commercial redistribution permitted (see source terms_url))
  verified-open: {reservable: true, commercial_ok: true, attribution: false, no_modify: false, url: ""}  # Stage 0b verified (Verified: redistribution permitted (see source terms_url))
  audit-restricted: {reservable: false, commercial_ok: false, attribution: required, no_modify: false, url: ""}  # Stage 0b: verbatim audit flagged NOT clearable (third-party carve-out / permission required / unresolved) -- gated pending review
  spi-embed-2026: {reservable: false, commercial_ok: false, attribution: required, no_modify: true, url: ""}  # SPI written permission 2026: official Tableau embed only, no dataset redistribution
  damodaran-granted: {reservable: true, commercial_ok: false, attribution: required, no_modify: false, url: "https://pages.stern.nyu.edu/~adamodar/"}  # written grant 2026-07-15 (ad4@stern.nyu.edu): "I don't have a problem with you hosting this data." NC + attribution per our request
  bundesbank-granted: {reservable: true, commercial_ok: false, attribution: required, no_modify: true, url: "https://www.bundesbank.de/en/homepage/user-information/conditions-for-the-general-use-of-the-website-764706"}  # written reply 2026-07-15 (info@bundesbank.de, inquiry 2026/005812): "you may save, distribute or reproduce ... provided that you do so free of charge. The information must not be altered or distorted" + must cite "Copyright: Deutsche Bundesbank, Frankfurt am Main, Germany" and send them a copy
  idb-granted: {reservable: true, commercial_ok: false, attribution: required, no_modify: false, url: "https://data.iadb.org"}  # written grant 2026-07-15 (opendata@iadb.org): "you have our full permission to re-host and redistribute them" (CC-BY 4.0, institutional IDB data). Third-party carve-out pass run 2026-07-15: all 21 ingested datasets institutional, none excluded (data/_idb_carveout_audit.json). Citation format + per-dataset link-back required (CSV header Dataset row).
  defillama-granted: {reservable: true, commercial_ok: false, attribution: required, no_modify: false, url: "https://defillama.com"}  # written grant 2026-07-16 (support@defillama.com, "Rick"): "feel free to use our data ... as long as its non-commercial use and we get properly cited." NC + attribution.
sources:

  # ---- US federal, public domain ----
  sec_edgar:
    name: U.S. SEC EDGAR
    license: us-public-domain
    attribution: "Source: U.S. SEC EDGAR (public domain)"
    schedule: "0 7 * * *"
    homepage: https://www.sec.gov/edgar
    scope: "XBRL fundamentals + 13F + insider = DATA we host; filings = metadata POINTERS to sec.gov (NOT the documents)"
    datasets: [xbrl_fundamentals, filings_index, form13f, insider_forms]
  bls:      {name: Bureau of Labor Statistics, license: us-public-domain, schedule: "0 6 * * *", needs_key: true,  attribution: "Source: U.S. BLS (public domain)"}
  bea:      {name: Bureau of Economic Analysis, license: us-public-domain, schedule: "0 6 * * *", needs_key: true,  attribution: "Source: U.S. BEA (public domain)"}
  census:   {name: U.S. Census Bureau,          license: us-public-domain, schedule: "0 6 * * 1", needs_key: true,  attribution: "Source: U.S. Census Bureau (public domain)"}
  treasury: {name: U.S. Treasury FiscalData + Yield Curve, license: us-public-domain, schedule: "0 6 * * *", attribution: "Source: U.S. Treasury (public domain)"}
  fed_board: {name: Federal Reserve Board (H.15 etc.), license: us-public-domain, schedule: "0 6 * * *", attribution: "Source: Federal Reserve Board (public domain)"}
  eia:      {name: U.S. Energy Information Administration, license: us-public-domain, schedule: "0 6 * * *", needs_key: true, attribution: "Source: U.S. EIA (public domain)", tos_note: "ToS permits building a public display service (verified 2026-06-01). Attribute to EIA; do NOT use the EIA logo; do NOT claim EIA as source for modified/derived values -> label Clean/derived tier 'derived from EIA data'."}
  usda:     {name: USDA NASS + ERS, license: us-public-domain, schedule: "0 6 * * 1", needs_key: true, attribution: "Source: USDA (public domain)"}
  noaa:     {name: NOAA NCEI / Climate Data Online, license: us-public-domain, schedule: "0 6 * * 1", needs_key: true, attribution: "Source: NOAA (public domain)"}
  fhfa:     {name: FHFA House Price Index, license: us-public-domain, schedule: "0 6 * * 1", attribution: "Source: U.S. FHFA (public domain)"}

  # ---- CC BY 4.0 / open-government ----
  worldbank:        {name: World Bank Open Data (WDI), license: cc-by-4.0, schedule: "0 6 * * 1", attribution: "Source: World Bank, World Development Indicators (CC BY 4.0)"}
