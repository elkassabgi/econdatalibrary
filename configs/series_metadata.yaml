# Source-level series metadata (OWID-style) — merged into every series' metadata
# JSON by core/build_series_metadata.py. Per-series metadata always WINS over these
# source-level defaults. The /v1 metadata endpoint, the D1 export, bundle provenance,
# and the landing pages all read these keys.
#
# Fields per source:
#   description_key:        list of bulleted caveats a researcher MUST know.
#                           For hf_equities the survivorship-bias disclosure is FIRST.
#   description_processing: what the Elkassabgi Data Library did to the raw source.
#   citation_short / citation_long: PRODUCER FIRST, library "compiled by" second.
#
# Rule: never invent a caveat. Omit description_key for a source with no known
# material caveat; the builder still derives a producer-first citation from the
# registry (source.name + homepage) so every series is citable.

_defaults:
  description_processing: >-
    Retrieved from the official source, normalized to a long {series_key, obs_date,
    value} schema (period-start dates), de-duplicated, and stored as zstd Parquet.
    Compiled and redistributed by the Elkassabgi Data Library.

sources:

  # ---- US equity intraday (the hfdatalibrary product) ----
  hf_equities:
    description_key:
      - >-
        SURVIVORSHIP BIAS: the ticker universe is a ~2023 snapshot of then-active
        U.S. symbols. Securities that delisted, merged, or were renamed BEFORE that
        snapshot are absent, so historical cross-sections are biased toward survivors.
        Do NOT treat the panel as a point-in-time-complete record of the market.
      - >-
        Spliced series: bars before 2022 and from 2022 onward (IEX Exchange HIST)
        come from different feeds; the splice point is a known seam. Per-segment
        provenance is carried so each observation's true origin is recoverable.
      - >-
        Intraday microstructure: 1-minute OHLCV bars carry cleaning flags
        (volume spikes, stale quotes, auction prints, splice artifacts); a single
        venue's tape is not the full consolidated NBBO.
    description_processing: >-
      1-minute OHLCV bars assembled per symbol, cleaned (volume-spike / stale-quote /
      auction / splice-artifact flags), spliced across feeds with the 2022 IEX
      Exchange HIST cutover, and stored per ticker. Compiled by the Elkassabgi Data Library.
    citation_short: "Elkassabgi High-Frequency Equity Data Library."
    citation_long: >-
      Elkassabgi High-Frequency Equity Data Library (1-minute U.S. equity bars; post-2022
      data from IEX Exchange HIST). Compiled by Ahmed Elkassabgi, University of Central Arkansas.

  # ---- US macro / official statistics ----
  bls:
    description_key:
      - >-
        Vintage rows: some flat-file surveys (e.g. CPI cu) carry multiple rows per
        (series, date) across release vintages; ~96k (series, date) groups differ in
        value (genuine revisions). Take the latest vintage unless you need a back-run.
      - "Series ids follow the BLS scheme; the survey prefix (first 2 chars) selects the file."
    citation_short: "U.S. Bureau of Labor Statistics (BLS)."
    citation_long: >-
      U.S. Bureau of Labor Statistics. Retrieved from https://www.bls.gov. Compiled and
      redistributed by the Elkassabgi Data Library.
  bea:
    description_key:
      - "NIPA aggregates are revised; the library stores the published value without a vintage axis (latest-known)."
    citation_short: "U.S. Bureau of Economic Analysis (BEA)."
    citation_long: >-
      U.S. Bureau of Economic Analysis, National Income and Product Accounts. Retrieved from
      https://www.bea.gov. Compiled and redistributed by the Elkassabgi Data Library.
  fed_board:
    citation_short: "Board of Governors of the Federal Reserve System."
    citation_long: >-
      Board of Governors of the Federal Reserve System (US). Retrieved from
      https://www.federalreserve.gov. Compiled and redistributed by the Elkassabgi Data Library.
  treasury:
    description_key:
      - "Relational/wide Fiscal Data tables (e.g. Debt to the Penny); the measure columns are not a single value series."
    citation_short: "U.S. Department of the Treasury, Fiscal Data."
    citation_long: >-
      U.S. Department of the Treasury (Fiscal Data). Retrieved from
      https://fiscaldata.treasury.gov. Compiled and redistributed by the Elkassabgi Data Library.
  census:
    description_key:
      - "Census Economic Indicators (EITS); relational rows — the observation value is in cell_value, not a 'value' column."
    citation_short: "U.S. Census Bureau."
    citation_long: >-
      U.S. Census Bureau, Economic Indicators Time Series. Retrieved from
      https://www.census.gov. Compiled and redistributed by the Elkassabgi Data Library.
  fhfa:
    description_key:
      - "House Price Index; NSA index in index_nsa (relational cube), seasonally-adjusted in index_sa."
    citation_short: "U.S. Federal Housing Finance Agency (FHFA)."
    citation_long: >-
      U.S. Federal Housing Finance Agency, House Price Index. Retrieved from
      https://www.fhfa.gov. Compiled and redistributed by the Elkassabgi Data Library.
  eia:
    citation_short: "U.S. Energy Information Administration (EIA)."
    citation_long: >-
