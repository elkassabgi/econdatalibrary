  sec_edgar:
    description_key:
      - "Company XBRL fundamentals; the SEC 'filed' date is kept as vintage_date (point-in-time), so a (metric, period) can repeat across filings."
    citation_short: "U.S. Securities and Exchange Commission, EDGAR."
    citation_long: >-
      U.S. Securities and Exchange Commission (EDGAR company facts). Retrieved from
      https://www.sec.gov/edgar. Compiled and redistributed by the Elkassabgi Data Library.

