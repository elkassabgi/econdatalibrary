  usda:
    description_key:
      - "USDA NASS Quick Stats; a catalog id is a grouped indicator spanning all geographies/years sharing one SHORT_DESC."
    citation_short: "USDA National Agricultural Statistics Service (Quick Stats)."
    citation_long: >-
