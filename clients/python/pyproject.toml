[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "econdl"
version = "0.1.0"
description = "Econ Data Library client: multi-source, citable, one-command-updatable data bundles."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Elkassabgi" }]
keywords = ["economics", "statistics", "time-series", "open-data", "macroeconomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
]

[project.urls]
Homepage = "https://econdatalibrary.com"
Source = "https://github.com/elkassabgi/econdatalibrary"
Issues = "https://github.com/elkassabgi/econdatalibrary/issues"

[tool.setuptools]
packages = ["econdl"]
