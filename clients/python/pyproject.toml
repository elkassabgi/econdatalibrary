[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "econdl"
version = "0.1.0"
description = "Econ Data Library client: multi-source, citable, one-command-updatable data bundles."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Elkassabgi" }]
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
]

[project.urls]
Homepage = "https://www.econfindatalibrary.com"

[tool.setuptools]
packages = ["econdl"]
