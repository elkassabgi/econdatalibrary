  - source_id: unctad_rfia
    publisher: UNCTAD
    dataset: >-
      Number of exporters - "Long pile" knit or crochet textile fabric
    measured: 2026-08-10
    probe: >-
      GET https://unctadstat-api.unctad.org/api/datacenter/en — UNCTADstat's own Data Centre
      catalogue, the endpoint its SPA calls on load (found via config.js STATS_API + the page's
      performance entries; no list endpoint is documented and every guessed path 404s). Enumerated
      the FULL current catalogue, then diffed it against the 93 US.* dataset codes our fetchers
      already bind. Separately value-verified this store against its closest served sibling with
      tools/unctad_rekey_crosswalk.py (period-aligned, >=3 shared points, 0.90 agreement floor).
    finding: >-
      UNCTAD's entire live catalogue is 99 datasets; we already fetch 93, and the 6 unfetched are
      the known giants (BiotradeMerch, TradeFoodCatByProc, TradeFoodProcByCat, TradeMatrix,
      TradeServCatByPartner, TransportCosts). No current dataset carries this relay-era product,
      so there is nothing upstream to re-key to. Values confirm the data is not redundant either:
      only 0 of 24,720 series are covered by rca, so retiring it would destroy unique
      observations. UNCTAD discontinued this product in its data-hub rebuild.
    decision: >-
      Keep SERVED-FROZEN as archival. No fetcher can exist. Ahmed 2026-08-09 authorised a re-key
      and the enumeration above shows a re-key is impossible; he separately ruled (UNESCO, same
      day) that fully downloadable archival sources stay listed, labelled so nobody expects fresh
      data.
