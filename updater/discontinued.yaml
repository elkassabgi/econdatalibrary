  # THE SIX FAO NO-SUCCESSOR SOURCES (#19 campaign, all measured 2026-08-08 against FAOSTAT's
  # own bulk index + full-dataset id/element inventories; probes in _fao_*_prove.log and the
  # decompose logs in the repo root). The other 12 fao_* sources were promoted the same day —
  # these six are the residue where the publisher removed the id space itself.

  - source_id: fao_gl
    publisher: FAO (FAOSTAT)
    dataset: Emissions - Land Use total (old GL domain)
    measured: 2026-08-08
    probe: >-
      GET https://bulks-faostat.fao.org/production/datasets_E.json then
      tools/prove_faostat_repair.py --source fao_gl --code GT (the only dataset carrying
      land-use totals) — permutation-scored id reproduction over GT's full 2.5M-row bulk;
      plus element inventories of GCE/GLE/GF/GT/GN collected the same day.
    finding: >-
      0.0% of 3,057 ids reproduce. Every fao_gl series is element 7217 (net CO2eq under
      pre-AR5 GWP factors); no current FAOSTAT dataset publishes that element, and the AR5
      successors (72xxxx family) carry a different GWP basis — value-verified refusal on the
      same day for fao_gt (7 of 7,650 candidates, ledger R403). No continuation is lawful.
    decision: >-
      Stays SERVED and frozen as a prior-GWP-basis archival vintage.

  - source_id: fao_es
    publisher: FAO (FAOSTAT)
    dataset: Environment - Soil erosion (GLASOD)
    measured: 2026-08-08
    probe: >-
      GET https://bulks-faostat.fao.org/production/datasets_E.json searched for environment/soil datasets; only
      ESB (Cropland Nutrient Balance) and LC (Land Cover) exist — no soil-erosion dataset.
    finding: >-
      The GLASOD soil-erosion indicator set (element 7219) is published nowhere in the
      current 69-dataset FAOSTAT bulk catalogue. FAO retired the old Environment domain.
    decision: Stays SERVED and frozen as archival.

