# Sources the PUBLISHER has discontinued. Served-frozen on purpose; no fetcher can exist.
#
# WHY THIS FILE EXISTS. `tools/audit_schedule_coverage.py` prints "served but NOT auto-updating"
# as the work queue. That queue is what the loop works down, so anything in it is a promise that
# someone can build a fetcher. For a dataset the publisher has retired, nobody can — and leaving
# it at the top of the list means the largest apparent gap in the library is permanently
# un-closable. imf_ifs alone is 100,706 series, 24% of the entire gap.
#
# WHY IT IS DANGEROUS AND WHAT STOPS THE ABUSE. A file that removes things from the work queue is
# a rug. Three rules, enforced by tests/test_discontinued_registry.py:
#   1. Every entry carries `probe` (what was actually run), `finding` (what it returned) and
#      `measured` (when). A verdict with no measurement is not admissible here.
#   2. Nothing in this file may be `live: true` in registry.yaml — declaring a source dead while
#      scheduling it is a contradiction, and the test fails on it.
#   3. The audit still counts these series as NOT auto-updating. They are frozen; saying
#      otherwise would be the lie this file exists to avoid. It reports them under their own
#      heading, with the finding, so a reader sees WHY rather than a silent omission.
#
# To add one: measure the publisher yourself, today. A note in a task, a comment in a fetcher, or
# a previous session's summary is a citation, not a measurement (ledger R381, R386).

sources:
  - source_id: imf_ifs
    publisher: International Monetary Fund
    dataset: International Financial Statistics (IFS)
    measured: 2026-08-07
    probe: >-
      GET https://api.imf.org/external/sdmx/2.1/dataflow — the SDMX 2.1 dataflow catalogue that
      every imf_*_direct fetcher already uses as its change signal — then matched every published
      Dataflow id and Name against "IFS" and "International Financial Statistics".
    finding: >-
      222 dataflows published, 0 matching. IMF retired IFS and re-keyed its contents into
      per-dataset flows (BOP, MFS_FC, MFS_MA, ER/EER, PI, IMTS, ITG and others), which this
      library already serves first-hand as 54 imf_*_direct sources. Our imf_ifs store holds
      13,460,864 rows across 100,706 series ending 2025-07-01 and cannot be extended from the
      publisher by any route.
    decision: >-
      Stays SERVED and frozen as an archival snapshot. Not retired, not deleted, not re-keyed —
      those would break live series ids for a dataset whose successors use different keys and
      whose crosswalk is uneven (measured in _imf_direct.py: FDI 95.3%, APDREO 100%, WHDREO 56%,
      FAS/WORLD/COFER ~0%). A replacement id is Ahmed's call, not a side effect of this file.

  # THE OTHER THREE LEGACY IMF SOURCES, plus gender budgeting. Same probe as imf_ifs, same day,
  # same catalogue of 222 published dataflows. Each was matched on its own id AND on the words in
  # its name, and every one returned zero. Together with imf_ifs that is 148,754 series of the
  # work queue that no fetcher could ever have closed.

  - source_id: imf_gfsfalcs
    publisher: International Monetary Fund
    dataset: GFS Financial Assets and Liabilities by Counterpart Sector
    measured: 2026-08-07
    probe: >-
      GET https://api.imf.org/external/sdmx/2.1/dataflow, matching all 222 published Dataflow ids
      and Names against "FALCS", "Financial Assets and Liabilities" and "Counterpart".
    finding: >-
      0 flows match FALCS. Our store holds 232,215 rows across 20,249 series ending 2024-01-01.
      A RELATED flow does exist - GFS_SFCP, "GFS Stocks and Flows by Counterparty" - and this
      library already serves it first-hand as imf_gfssfcp_direct (41,751 series). Whether it is a
      key-level successor to these series is NOT measured here and should not be assumed.
    decision: >-
      Served and frozen as an archival snapshot. Its counterpart data continues under a separate,
      already-live source id, so nothing a user can reach today is being left behind.

  - source_id: imf_fsire
    publisher: International Monetary Fund
    dataset: Financial Soundness Indicators - Reporting Entities
    measured: 2026-08-07
    probe: >-
      GET https://api.imf.org/external/sdmx/2.1/dataflow, matching all 222 published Dataflow ids
      and Names against "FSIRE", "Reporting Entit" and "Reporting".
    finding: >-
      0 flows match, on either the id or the word "Reporting" anywhere in a name. The three FSI
      datasets IMF still publishes (FSIBSIS, FSIC, FSICDM) are already served first-hand here as
      imf_fsibsis_direct, imf_fsic_direct and imf_fsicdm_direct. Our store holds 88,487 rows across
      18,620 series ending 2025-01-01.
    decision: Served and frozen as an archival snapshot; the live FSI datasets are served already.

  - source_id: imf_pgi
    publisher: International Monetary Fund
    dataset: Principal Global Indicators
    measured: 2026-08-07
    probe: >-
      GET https://api.imf.org/external/sdmx/2.1/dataflow, matching all 222 published Dataflow ids
      and Names against "PGI" and "Principal Global".
    finding: >-
      0 flows match. Our store holds 1,077,057 rows across 8,891 series and already stopped at
      2020-05-01 - it has been frozen for six years, which is corroborating evidence rather than
      a symptom of anything this library did.
    decision: Served and frozen as an archival snapshot.

  - source_id: imf_gender_budgeting
    publisher: International Monetary Fund
    dataset: Gender Budgeting
    measured: 2026-08-07
    probe: >-
      GET https://api.imf.org/external/sdmx/2.1/dataflow, matching all 222 published Dataflow ids
      and Names against "BUDGET" and "GENDER".
    finding: >-
      0 flows contain "BUDGET". IMF does publish eight Gender Statistics flows (GS_LGRGHTS,
      GS_LEPM, GS_SDO, GS_ATF, GS_CGI, GS_ED and others), five of which are already served here as
      imf_gs*_direct, but none of them is gender budgeting. Our store holds 288 rows across 288
      series ending 2016-01-01.
    decision: Served and frozen as an archival snapshot.

  # THE FOUR UNESCO SOURCES, AND THE TRAP IN MEASURING THEM. A cycle-36 note called these
  # publisher-discontinued. Probing UIS looked at first like it REFUTED that: the live API reports
  # themes CULTURE and SCIENCE_TECHNOLOGY_INNOVATION both with a "February 2026 Data Release".
  # They do — with a different indicator set. The theme being alive is not our indicators being
  # alive, and stopping at the theme list would have put 57,530 series back in the work queue as
  # buildable when almost none of them can be refreshed. The code-level overlap is the real
  # measurement and it supports the original verdict.

  - source_id: unesco_cltt
    publisher: UNESCO Institute for Statistics
    dataset: Culture — international trade in cultural goods and services
    measured: 2026-08-07
    probe: >-
      GET https://api.uis.unesco.org/api/public/definitions/indicators (5,063 indicator codes
      across EDUCATION, DEMOGRAPHIC_SOCIOECONOMIC, CULTURE and SCIENCE_TECHNOLOGY_INNOVATION),
      intersected against the distinct indicator codes parsed from our own store keys.
    finding: >-
      0 of our 34 indicator codes are still published — G_ALL_BAL, G_CLT_BAL, G_EXP_ALL,
      G_EXP_AV_MED, G_EXP_CLT and the rest are all absent. Our store holds 76,793 rows across
      6,226 series ending 2019-01-01.
    decision: Served and frozen as an archival snapshot; no fetcher is possible for these codes.

  - source_id: unesco_inno
    publisher: UNESCO Institute for Statistics
    dataset: Innovation statistics
    measured: 2026-08-07
    probe: >-
      GET https://api.uis.unesco.org/api/public/definitions/indicators, intersected against the
      distinct indicator codes parsed from our own store keys.
    finding: >-
      0 of our 638 indicator codes are still published — the whole CO.IP* family (CO.IPCLI,
      CO.IPCOMP, CO.IPCONS, CO.IPGOV, CO.IPGRP …) is gone. The API's SCIENCE_TECHNOLOGY_INNOVATION
      theme is alive but ships 12 unrelated codes (EXPGDP.TOT, FRESP.SP.TFTE.*). Our store holds
      43,802 rows across 18,909 series ending 2014-01-01.
    decision: Served and frozen as an archival snapshot; no fetcher is possible for these codes.

  - source_id: unesco_film
    publisher: UNESCO Institute for Statistics
    dataset: Feature film statistics
    measured: 2026-08-07
    probe: >-
      GET https://api.uis.unesco.org/api/public/definitions/indicators, intersected against the
      distinct indicator codes parsed from our own store keys.
    finding: >-
      1 of our 76 indicator codes is still published (220174); 220000, 220002, 220003, 220004,
      220005 and the remaining 74 are absent. Our store holds 70,467 rows across 8,527 series
      ending 2017-01-01. A fetcher could refresh 1.3% of the source.
    decision: >-
      Served and frozen. The single surviving code is real but is not worth a fetcher on its own;
      recorded here so the 1.3% is not misreported as zero.

  - source_id: unesco_clte
    publisher: UNESCO Institute for Statistics
    dataset: Culture employment
    measured: 2026-08-07
    probe: >-
      GET https://api.uis.unesco.org/api/public/definitions/indicators, intersected against the
      distinct indicator codes parsed from our own store keys.
    finding: >-
      21 of our 408 indicator codes are still published (5.1%), and under a re-scheme — the
      survivors are all the new CE.RA.* form (CE.RA.CULOCC1.1.OV.ILOSTAT.1 …) while our legacy
      numeric codes 700146-700150 and the other 387 are absent. Our store holds 36,538 rows across
      23,868 series ending 2016-01-01.
    decision: >-
      Served and frozen. The 21 live CE.RA.* codes are a genuine but small successor set under
      different keys; building them would be a NEW source id, not a refresh of these series, and
      re-keying existing ids is reserved for Ahmed.
