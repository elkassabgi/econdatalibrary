  # THE FOUR UNESCO SOURCES, AND THE TRAP IN MEASURING THEM. A cycle-36 note called these
  # publisher-discontinued. Probing UIS looked at first like it REFUTED that: the live API reports
  # themes CULTURE and SCIENCE_TECHNOLOGY_INNOVATION both with a "February 2026 Data Release".
  # They do — with a different indicator set. The theme being alive is not our indicators being
  # alive, and stopping at the theme list would have put 57,530 series back in the work queue as
  # buildable when almost none of them can be refreshed. The code-level overlap is the real
  # measurement and it supports the original verdict.

  - source_id: unesco_cltt
    publisher: UNESCO Institute for Statistics
    dataset: Culture — international trade in cultural goods and services
    measured: 2026-08-07
    probe: >-
      GET https://api.uis.unesco.org/api/public/definitions/indicators (5,063 indicator codes
      across EDUCATION, DEMOGRAPHIC_SOCIOECONOMIC, CULTURE and SCIENCE_TECHNOLOGY_INNOVATION),
      intersected against the distinct indicator codes parsed from our own store keys.
    finding: >-
      0 of our 34 indicator codes are still published — G_ALL_BAL, G_CLT_BAL, G_EXP_ALL,
      G_EXP_AV_MED, G_EXP_CLT and the rest are all absent. Our store holds 76,793 rows across
      6,226 series ending 2019-01-01.
    decision: Served and frozen as an archival snapshot; no fetcher is possible for these codes.

  - source_id: unesco_inno
    publisher: UNESCO Institute for Statistics
    dataset: Innovation statistics
    measured: 2026-08-07
    probe: >-
      GET https://api.uis.unesco.org/api/public/definitions/indicators, intersected against the
      distinct indicator codes parsed from our own store keys.
    finding: >-
      0 of our 638 indicator codes are still published — the whole CO.IP* family (CO.IPCLI,
      CO.IPCOMP, CO.IPCONS, CO.IPGOV, CO.IPGRP …) is gone. The API's SCIENCE_TECHNOLOGY_INNOVATION
      theme is alive but ships 12 unrelated codes (EXPGDP.TOT, FRESP.SP.TFTE.*). Our store holds
      43,802 rows across 18,909 series ending 2014-01-01.
    decision: Served and frozen as an archival snapshot; no fetcher is possible for these codes.

  - source_id: unesco_film
    publisher: UNESCO Institute for Statistics
    dataset: Feature film statistics
    measured: 2026-08-07
    probe: >-
      GET https://api.uis.unesco.org/api/public/definitions/indicators, intersected against the
      distinct indicator codes parsed from our own store keys.
    finding: >-
      1 of our 76 indicator codes is still published (220174); 220000, 220002, 220003, 220004,
      220005 and the remaining 74 are absent. Our store holds 70,467 rows across 8,527 series
      ending 2017-01-01. A fetcher could refresh 1.3% of the source.
    decision: >-
      Served and frozen. The single surviving code is real but is not worth a fetcher on its own;
      recorded here so the 1.3% is not misreported as zero.

