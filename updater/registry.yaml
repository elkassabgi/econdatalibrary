version: 1
generated_from: matrix + classifications
sources:
- source_id: abs
  live: true
  scripts:
  - jobs/ingest_abs_full.py
  strategy: sdmx_delta
  strategy_reason: ABS is an SDMX 2.1 NSO; matrix confirms startPeriod is supported, so pull only periods newer than each
    flow's stored max(obs_date) and merge per dataflow instead of the current skip-if-file-exists full pull.
  cadence: monthly
  refresh_cost: large
  out_dir: abs
  review: true
  adapter:
    vintage_signal: 'Per-dataflow: query GET https://data.api.abs.gov.au/rest/data/ABS,<FLOW>/all with ?startPeriod=<last_obs+1>
      (date-tail). For change-gating across the catalog, SDMX 2.1 supports ?updatedAfter=<last_success> on the data endpoint
      and df[''version''] is already fetched in the sidecar (currently stored-but-never-compared) and can gate whole-flow
      refresh.'
    since_param: startPeriod=<last_obs_year/period+1> on /rest/data/ABS,<FLOW>; optional updatedAfter=<last_success_iso> to
      scope changed flows
    out_paths_note: 'Multi-file: one parquet per dataflow at data/clean_full/abs/<FLOW>.parquet (~1222 files) plus sidecar
      data/clean_full/abs_catalog.parquet. Requires replacing the line ~434 existence-skip with read-existing-then-merge.'
    rate_note: No API key. API is flaky (drops mid-body) - keep 5x exponential backoff on IncompleteRead/429/5xx; hardcoded
      UA; no rate-limit param.
    key_env: none
    confidence: high
    open_question: Is df['version'] (already captured in the sidecar) reliable enough to gate whole-flow refresh, or must
      we rely on startPeriod date-tail per flow? Confirm whether ABS honors updatedAfter on the data endpoint.
  matrix:
    refresh_mechanism:
    - skip-if-series-exists
    force_refresh_procedure:
    - 'Must delete the per-flow parquet outputs first because existing files are skipped (main() line ~434: `if os.path.exists(out_path):
      ... continue`). Run: `del /Q D:\research\econfindatalibrary\data\clean_full\abs\*.parquet` (PowerShell: `Remove-Item
      D:\research\econfindatalibrary\data\clean_full\abs\*.parquet`) and optionally `del D:\research\econfindatalibrary\data\clean_full\abs_catalog.parquet`,
      then `python.exe D:\research\econfindatalibrary\jobs\ingest_abs_full.py`. For a single flow: `python.exe ...\jobs\ingest_abs_full.py
      --only CPI` (after deleting CPI.parquet). No checkpoint JSON to clear — resume state is purely the presence of *.parquet
      files.'
    incremental_path:
    - Not feasible without rework as written. ABS SDMX supports a startPeriod query param; add it to stream_rows()/collect()
      (qp['startPeriod']=last_obs_year) and change the per-flow logic to read the existing parquet's max(obs_date) per flow,
      fetch only newer periods, and APPEND/merge into the existing file instead of skipping it. Today the existence check
      at line 434 unconditionally skips any flow that already has a file, so even a code change to add startPeriod would be
      dead until the skip is replaced by a read-existing-then-merge path.
    keys_or_blockers:
    - 'No API key. Blocker: ABS API is flaky/drops connections mid-body (handled with 5x exponential-backoff retries on streaming
      breaks, IncompleteRead, 429/5xx). Hardcoded UA. No rate-limit param.'
    storage_layout:
    - 'overwrite-multi-file: one zstd parquet per dataflow at data/clean_full/abs/<FLOW>.parquet (~1222 files), each with
      columns (series_key, obs_date, value); oversized flows (>8M obs) written as a single multi-rowgroup parquet split by
      FREQ via ParquetWriter. Sidecar catalog at data/clean_full/abs_catalog.parquet.'
- source_id: adb
  live: true
  scripts:
  - jobs/ingest_adb_kidb.py
  strategy: sdmx_delta
  strategy_reason: ADB KIDB is SDMX 3.0 and the matrix confirms startPeriod is accepted on the data URL; annual cadence makes
    deltas cheap, so fetch only periods after each flow's max(obs_date) and merge per dataflow.
  cadence: annual
  refresh_cost: medium
  out_dir: adb
  review: true
  adapter:
    vintage_signal: 'Date-tail per flow: append &startPeriod=<last_obs_year+1> to GET /v4/sdmx/data/{agency},{flow}/{freq}.{code}.?format=sdmx-csv.
      No clean vintage/version feed is exposed, so re-pull at startPeriod=last_year for changed-flow safety; _dataflows.json
      catalog cache detects newly added flows.'
    since_param: startPeriod=<last_obs_year+1> on /v4/sdmx/data/{agency},{flow}/{freq}.{code}.
    out_paths_note: 'Multi-file: one parquet per dataflow at data/clean_full/adb/<FLOW>.parquet (~59) plus sidecars _dataflows.json,
      _economies.json, _empty/<FLOW>.txt. Empty flags can permanently suppress flows that later gain data - clear _empty on
      delta runs.'
    rate_note: No API key. Full-flow dumps 504 (must go per-indicator); 422/504 -> per-economy fallback; 1.0s RATE sleep between
      calls; 429 -> 60s sleep. Self-throttling makes runs slow.
    key_env: none
    confidence: medium
    open_question: Given annual cadence + tiny size, is per-flow SDMX delta worth the merge refactor, or is overwrite_if_changed
      (re-pull whole flow yearly) operationally simpler? No reliable per-flow vintage signal exists to gate overwrite, which
      is why I chose delta.
  matrix:
    refresh_mechanism:
    - skip-if-series-exists
    force_refresh_procedure:
    - 'Delete the per-flow parquets AND the empty flags AND the cached dataflow list to force a clean catalog re-enumeration:
      `Remove-Item D:\research\econfindatalibrary\data\clean_full\adb\*.parquet; Remove-Item -Recurse D:\research\econfindatalibrary\data\clean_full\adb\_empty\*;
      Remove-Item D:\research\econfindatalibrary\data\clean_full\adb\_dataflows.json` (optionally also _economies.json), then
      `python.exe D:\research\econfindatalibrary\jobs\ingest_adb_kidb.py`. To refresh just one flow, delete data\clean_full\adb\<FLOW>.parquet
      and data\clean_full\adb\_empty\<FLOW>.txt.'
    incremental_path:
    - 'Not feasible as written without per-flow merge logic. ADB SDMX 3.0 supports startPeriod; harvest_indicator() builds
      the URL `/v4/sdmx/data/{agency},{flow}/{freq}.{code}.?format=sdmx-csv` and could append `&startPeriod=<year>`. But the
      data is annual and the script skips any flow whose parquet exists (main() line ~244), so true delta needs: read existing
      parquet max(obs_date), add startPeriod to the URL, and merge+dedup into the existing file rather than skipping. Given
      annual cadence and small size, full re-pull is the pragmatic refresh.'
    keys_or_blockers:
    - 'No API key. Blockers: full-flow A.. dumps return 504 (must go per-indicator); 422/504 triggers per-economy fallback
      using accumulated economy codes; 1.0s RATE sleep between calls; 429 -> 60s sleep. Self-throttling makes a full rebuild
      slow.'
    storage_layout:
    - 'overwrite-multi-file: one zstd parquet per dataflow at data/clean_full/adb/<FLOW>.parquet (~59 written), long format
      (series_key=ADB:{FLOW}:{IND}:{ECON}, obs_date, value). Sidecars: _dataflows.json (catalog cache), _economies.json (accumulated
      economy codes, atomically replaced), _empty/<FLOW>.txt flags.'
- source_id: barro_lee
  live: true
  scripts:
  - jobs/ingest_barro_lee.py
  strategy: overwrite_if_changed
  strategy_reason: Static academic dataset of 15 hardcoded GitHub Pages CSVs rebuilt into one parquet; a 'delta' is meaningless
    - re-fetch and overwrite the single parquet only when the upstream files move.
  cadence: static
  refresh_cost: fast
  out_dir: barro_lee
  review: true
  adapter:
    vintage_signal: HTTP conditional on each barrolee.github.io CSV (ETag / Last-Modified via If-Modified-Since), or the GitHub
      commit SHA of the barrolee.github.io Pages repo. Currently the script exits immediately if barro_lee.parquet exists
      (line ~159) and never re-fetches - add the conditional check.
    since_param: n/a
    out_paths_note: 'Single file: data/clean_full/barro_lee/barro_lee.parquet (~239K obs). In-run dedup already handles overlapping
      MF/F/M aggregate files.'
    rate_note: No API key, no rate limits (0.3s courtesy sleep). Only blocker is upstream URL/file-name changes (15 paths
      hardcoded).
    key_env: none
    confidence: high
    open_question: When Barro-Lee publish a new vintage they may change file names / version prefix (BL_v3_* -> v4); the hardcoded
      15-path list won't auto-discover that. Acceptable to require a human to bump the file list on a new release?
  matrix:
    refresh_mechanism:
    - skip-if-series-exists
    force_refresh_procedure:
    - 'Delete the single output then re-run: `Remove-Item D:\research\econfindatalibrary\data\clean_full\barro_lee\barro_lee.parquet;
      python.exe D:\research\econfindatalibrary\jobs\ingest_barro_lee.py`. (The _barro_lee_log*.txt / _err*.txt files are
      external run logs, not used by the script; clearing them is optional.)'
    incremental_path:
    - 'Not applicable / already effectively full-overwrite. The dataset is a static academic release (1950-2020, 5-year intervals)
      that updates only when Barro-Lee publish a new vintage. A ''true delta'' is meaningless; the right pattern is: bump
      to the new file list / new BASE version when a new release appears and overwrite the single parquet. Could add an HTTP
      If-Modified-Since/etag check to skip re-download when GitHub Pages files are unchanged, but value is low.'
    keys_or_blockers:
    - No API key, no rate limits (0.3s courtesy sleep between files). Source is GitHub Pages static CSVs; only blocker is
      upstream URL/file-name changes (the 15 paths are hardcoded).
    storage_layout:
    - 'single parquet: data/clean_full/barro_lee/barro_lee.parquet (zstd), columns (series_key=BARRO_LEE:{var}:{agefrom}_{ageto}:{sex}:{iso3},
      obs_date, value). ~239K obs.'
- source_id: bcb
  live: true
  scripts:
  - jobs/ingest_bcb.py
  strategy: extend_by_date
  strategy_reason: BCB SGS API natively accepts dataInicial/dataFinal (already used for the daily-406 fallback), so compute
    max(obs_date) per series and fetch only newer rows - far better than the current skip-sid resume that never extends existing
    series.
  cadence: monthly
  refresh_cost: fast
  out_dir: bcb
  review: true
  adapter:
    vintage_signal: 'Date-tail / always-fetch recent: per series read existing bcb.parquet max(obs_date), request dataInicial=max_date+1..today.
      No upstream vintage feed; freshness is the date tail itself.'
    since_param: dataInicial=<max_obs_date+1>&dataFinal=<today> on https://api.bcb.gov.br/dados/serie/bcdados.sgs.{sid}/dados?formato=json
    out_paths_note: 'Single file: data/clean_full/bcb/bcb.parquet (~300 curated series). MUST add (series_key,obs_date) dedup
      before append - current code appends with no dedup, so wiring deltas onto an existing series will duplicate unless dedup
      is added (today only the skip-sid path avoids dupes).'
    rate_note: No API key. Daily series reject full-history (HTTP 406) -> chunk into 9-year windows; 429 -> 60s sleep; 0.3s
      RATE between series.
    key_env: none
    confidence: high
    open_question: Curated ~300-series list is hardcoded (not the full SGS catalog) - should new SGS series be auto-discovered,
      or is the curated list intentional and frozen?
  matrix:
    refresh_mechanism:
    - skip-if-series-exists
    force_refresh_procedure:
    - 'Delete the single output (it is the resume state) then re-run: `Remove-Item D:\research\econfindatalibrary\data\clean_full\bcb\bcb.parquet;
      python.exe D:\research\econfindatalibrary\jobs\ingest_bcb.py`. To re-pull specific series only (still appends; will
      duplicate if those sids already in file): `python.exe ...\jobs\ingest_bcb.py --only=1,11,13522` or `python.exe ...\jobs\ingest_bcb.py
      13522`.'
    incremental_path:
    - 'Largely already supported at the fetch layer for daily series (get_series queries 9-year windows from 1994 to dt.date.today())
      — extending recent dates IS possible by date range. The missing piece is per-series delta: change the resume logic from
      ''skip sid if present'' to ''for each existing sid, compute max(obs_date) and fetch dataInicial=max_date+1, then append
      only newer rows''. The BCB SGS API natively supports dataInicial/dataFinal (already used for daily 406 fallback), so
      wiring last_obs per sid into both the full-history and windowed paths gives true since=last_obs deltas with minimal
      change.'
    keys_or_blockers:
    - 'No API key. Blockers: daily series reject full-history (HTTP 406) and must be chunked into 9-year windows (1994->today);
      429 -> 60s sleep; 0.3s RATE between series. Hardcoded curated series list (not a full SGS catalog).'
    storage_layout:
    - 'single parquet: data/clean_full/bcb/bcb.parquet (zstd), columns (series_key=''{label}:{sid}'', obs_date, value). ~300
      curated SGS series (deduped by sid). Plus _bcb_log.txt external log.'
- source_id: bcrp
  live: true
  upstream_verified:
    latest_obs: '2026-07-22'
    checked: '2026-07-29'
    method: >-
      NOT a data freeze — we are exactly level with the publisher. The gate reported
      RED-DATA (newest obs 2026-07-22, 7d old on a DAILY cadence), so BCRP's own API was
      queried directly for all three series we carry:
      PD04638PD (USDPEN_mid), PD04639PD (USDPEN_buy), PD04640PD (USDPEN_sell) over
      2026-07-01..2026-07-31. Each returns its last value-bearing observation on
      22.Jul.26 (3.40114285714286 / 3.398 / 3.404) and 'n.d.' for every later day —
      16 observations with data in July. BCRP has simply published nothing since the
      22nd. Declaring it here rather than muting the gate, because this is an assertion
      with an expiry: if our data falls BEHIND 2026-07-22 the declaration stops applying
      and RED-DATA stands, and the claim itself lapses to ATTENTION after
      UPSTREAM_RECHECK_DAYS so somebody re-probes instead of trusting a stale check.
  scripts:
  - jobs/ingest_bcrp.py
  strategy: extend_by_date
  strategy_reason: BCRP API URL is /{code}/json/{start}/{end} and fetch_series() already takes start/end, so compute max(obs_date)
    per series and fetch start=max_date+1 - the current skip-if-key-present logic never extends a daily series (stale for
    a daily source).
  cadence: daily
  refresh_cost: fast
  out_dir: bcrp
  review: true
  adapter:
    vintage_signal: 'Date-tail always-fetch: per series read existing bcrp.parquet max(obs_date), set start=max_date+1, end=today.
      No vintage feed; the daily date tail is the signal.'
    since_param: start=<max_obs_date+1> in /{code}/json/{start}/{end} (BASE=https://estadisticas.bcrp.gob.pe/estadisticas/series/api)
    out_paths_note: 'Single file: data/clean_full/bcrp/bcrp.parquet (6 daily FX series). Needs (series_key,obs_date) dedup
      on append - current append has none and relies on the series-key skip to avoid dupes.'
    rate_note: No API key. Only daily PD* series work (monthly/quarterly PN* return empty); single-series requests only (batching
      fails); 0.5s RATE; 3 retries linear backoff; Spanish month-name date parsing.
    key_env: none
    confidence: high
    open_question: none
  matrix:
    refresh_mechanism:
    - skip-if-series-exists
    force_refresh_procedure:
    - 'Delete the single output (it is the resume/done state) then re-run: `Remove-Item D:\research\econfindatalibrary\data\clean_full\bcrp\bcrp.parquet;
      python.exe D:\research\econfindatalibrary\jobs\ingest_bcrp.py`. (_bcrp_log.txt is an append-only run log; optional to
      clear.)'
    incremental_path:
    - 'fetch_series() already takes start/end and the BCRP API URL is `/{code}/json/{start}/{end}` — so true delta only needs:
      change resume logic from ''skip series if key present'' to ''compute max(obs_date) for that key from the existing parquet,
      set start=max_date+1, fetch, and append only the new rows''. Minimal change; the date-range plumbing exists.'
    keys_or_blockers:
    - 'No API key. Blockers: only daily PD* series work (monthly/quarterly PN* return empty per docstring); single-series
      requests only (batching fails); 0.5s RATE; 3 retries with linear backoff. Spanish month-name date parsing.'
    storage_layout:
    - 'single parquet: data/clean_full/bcrp/bcrp.parquet (zstd), columns (series_key=''BCRP:{label}'', obs_date, value). 6
      daily FX series (USD/EUR/GBP/JPY vs PEN). Plus _bcrp_log.txt.'
- source_id: bea
  scripts:
  - jobs/ingest_bea_full.py
  strategy: extend_by_date
  strategy_reason: BEA GetData currently hardcodes Year=ALL but the API accepts specific Year values, so a date filter (Year=prior..current)
    IS feasible; read each group parquet's max(obs_date) and re-pull only recent years, merging into the group file.
  cadence: monthly
  refresh_cost: medium
  out_dir: bea
  review: true
  adapter:
    vintage_signal: 'Date-tail by Year: per group read max(obs_date) and call with Year=<that_year>..<current> instead of
      ALL. No BEA-wide vintage/last-modified feed; recent-year re-pull-and-merge is the freshness mechanism. (Note: each _ingest_*
      helper hardcodes Year=''ALL'' + full pq.write_table overwrite, so this is a non-trivial refactor.)'
    since_param: 'Year=<max_obs_year..current_year> on GetData (per dataset: NIPA/Regional/etc.); MNE already loops Year so
      plug max_year there'
    out_paths_note: 'Multi-dir/multi-file: one parquet per table/cube under data/clean_full/bea/<dataset>/<group>.parquet
      (~600 files across 12 dataset dirs - NIPA 252, Regional 105, etc.). State in data/raw/bea/_done_groups.json; manifest
      data/raw/bea/catalog_manifest.json must pre-exist (this script does not build it).'
    rate_note: REQUIRES BEA_API_KEY (SystemExit if missing). BEA caps 100 req/min, 100MB/min, 30 err/min; in-code limiter
      holds <=85 req/min and <=70MB/min across 6 workers; 429/5xx backoff; error code 8 (volume quota) retried hard.
    key_env: BEA_API_KEY
    confidence: medium
    open_question: Errors are swallowed as empty [] and can silently write a 0-row group that is then marked done and skipped
      under --resume (data-loss-by-silence). Should the delta refactor fail loudly on empty responses rather than marking
      the group done?
  matrix:
    refresh_mechanism:
    - flag-controlled
    force_refresh_procedure:
    - 'For a complete fresh pull, run WITHOUT --resume (overwrites every group parquet regardless of done-set): `python.exe
      D:\research\econfindatalibrary\jobs\ingest_bea_full.py`. To be fully clean also clear the done-set and outputs: `Remove-Item
      D:\research\econfindatalibrary\data\raw\bea\_done_groups.json; Remove-Item -Recurse D:\research\econfindatalibrary\data\clean_full\bea\*`.
      Single dataset: `python.exe ...\jobs\ingest_bea_full.py --datasets NIPA`. NOTE: requires data\raw\bea\catalog_manifest.json
      to exist (load_manifest() reads it; there is no code in this script to (re)build it).'
    incremental_path:
    - 'Not feasible cheaply via the API used: GetData here always uses Year=''ALL''. BEA NIPA/etc. do accept specific Year
      values, so a delta could pass Year=<current and prior year> only and merge into existing group parquets. Concretely:
      read each group parquet''s max(obs_date), call call() with Year=that_year..current instead of ''ALL'', and overwrite
      the group with merged+deduped rows. Larger refactor because each dataset''s _ingest_* helper hardcodes Year=''ALL''
      and writes via full pq.write_table overwrite (no merge).'
    keys_or_blockers:
    - 'REQUIRES BEA_API_KEY env var via core.config.require(''BEA_API_KEY'') (read from .env / CI secret) — script SystemExit
      if missing. Rate limits enforced in-code: BEA caps 100 req/min, 100MB/min, 30 err/min; limiter holds <=85 req/min and
      <=70MB/min across 6 worker threads; 429/5xx backoff; error code 8 (volume quota) retried hard.'
    storage_layout:
    - 'overwrite-multi-file (grouped): one zstd parquet per table/cube under data/clean_full/bea/<dataset>/<group>.parquet
      (~600 files across 12 dataset dirs: NIPA 252, Regional 105, etc.). Columns series_key, obs_date, value (+ time_series_id
      / year extra cols for ITA/IIP/IntlServ*/MNE). State in data/raw/bea/_done_groups.json (atomic temp+replace); manifest
      at data/raw/bea/catalog_manifest.json.'
- source_id: bfs
  live: true
  scripts:
  - jobs/ingest_bfs.py
  strategy: sdmx_delta
  strategy_reason: BFS is PxWeb and the query already enumerates each table's time dimension via filter:item, so only the
    last N periods can be requested per table - matches the PxWeb/startPeriod delta pattern rather than the current full ~673-table
    rebuild.
  cadence: monthly
  refresh_cost: large
  out_dir: bfs
  review: true
  adapter:
    vintage_signal: 'PxWeb time-value selection: request only the most-recent time codes per table (filter:item on the ''time''
      dimension) and merge. PxWeb table metadata (GET /api/v1/de/<dbid>) exposes the latest available time values / an ''updated''
      timestamp that can gate per-table refresh. No combined-file vintage exists today (script holds all series in memory
      and overwrites one bfs.parquet).'
    since_param: filter:item on the time dimension restricted to values > last stored period (PxWeb has no startPeriod; you
      select recent time codes explicitly)
    out_paths_note: 'Currently single file: data/clean_full/bfs/bfs.parquet (~14MB, ~673 tables, German /de data endpoint).
      Delta requires restructuring to per-table parquets (or read-back + per-series max date) since there is no resume and
      the every-50-tables in-place checkpoint truncates the file on crash.'
    rate_note: No API key. English /en endpoint only lists; data must use German /de (English returns 400 for table data).
      MAX_CELLS=100000 guard down-samples oversized tables to aggregates by design; 0.3s RATE; 429 -> 30s sleep.
    key_env: none
    confidence: medium
    open_question: Does the BFS PxWeb metadata expose a reliable per-table 'last updated' timestamp to gate refresh, or must
      we always request the recent time tail for all ~673 tables? Also confirm the MAX_CELLS down-sampling is acceptable to
      keep under delta.
  matrix:
    refresh_mechanism:
    - overwrite-single-file
    force_refresh_procedure:
    - 'Just re-run; it always does a full rebuild and overwrites the single file: `python.exe D:\research\econfindatalibrary\jobs\ingest_bfs.py`.
      (Deleting data\clean_full\bfs\bfs.parquet first is harmless but unnecessary — the script overwrites it, and crucially
      does NOT read it on startup, so there is no resume.) No checkpoint JSON to clear.'
    incremental_path:
    - 'Not feasible as written without restructuring to per-table storage. PxWeb supports selecting only recent time values
      (the query already enumerates a ''time'' dimension''s values via filter:item), so a delta could request only the last
      N periods per table. But because the script holds ALL series in three big in-memory lists and overwrites one combined
      bfs.parquet (no per-table files, no read-back of existing data), a true since=last_obs delta would require: switch to
      one parquet per table (or read existing combined file, compute per-series max date), query only newer periods, and merge.
      Substantial refactor.'
    keys_or_blockers:
    - 'No API key. Blockers: English API returns 400 for individual table data (must use German /de endpoint for data, /en
      only for listing); MAX_CELLS=100000 guard — oversized tables are reduced to a total/aggregate slice per non-time dimension
      (so large BFS tables are only partially ingested by design); 0.3s RATE; 429 -> 30s sleep.'
    storage_layout:
    - 'single parquet: data/clean_full/bfs/bfs.parquet (zstd, ~14MB), columns (series_key=''BFS:{dbid}:{dim}={code}:...'',
      obs_date, value). Written incrementally to the SAME path as a checkpoint every 50 tables and once at the end.'
- source_id: bis
  live: true
  scripts:
  - jobs/ingest_bis_cbs_lbs.py
  - jobs/ingest_bis_full.py
