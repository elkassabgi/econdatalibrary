  upstream_verified:
    latest_obs: '2025-01-01'
    checked: '2026-07-29'
    method: >-
      Full pull of all 35 published indicators from api.uis.unesco.org on 2026-07-29
      (0 fetch failures): upstream's newest observation year is 2025 and ours now
      matches it exactly. The 574-day "data age" is simply how old UNESCO's most
      recent ANNUAL release is, not a gap on our side — the same run reported an
      upstream vintage age of 0d. Flagging this RED would report missing data that
      does not exist upstream, and a gate that cries wolf on complete sources is how
      a real freeze gets ignored.
  live: true
  scripts:
  - updater/strategies/fetchers/unesco_dem.py
  strategy: overwrite_if_changed
  strategy_reason: UIS republishes whole indicator series per data release (Feb/Sep) rather than appending a date tail —
    a new release restates history, so the correct move is re-pull-and-overwrite gated on the release version. Registered
    live=false until a `--source unesco_dem --force` dispatch proves the delta; joining the tier without that proof is how
    a source comes to be counted as covered while running nothing.
  cadence: irregular
  refresh_cost: fast
  out_dir: unesco_dem
  review: true
  adapter:
    vintage_signal: GET https://api.uis.unesco.org/api/public/versions — UIS's own release `version` plus each theme's
      `lastUpdate`. Deliberately the PUBLISHER's field. This source sat 4 years stale (DBnomics last indexed UNESCO
      2022-04-04) precisely because the previous signal certified the RELAY's hash, which stays constant while the
      publisher moves on (ledger R73).
    since_param: none — one GET per indicator returns that indicator's full history for every country.
    out_paths_note: Single parquet data/clean_full/unesco_dem/unesco_dem.parquet. series_key 'UNESCO_DEM:{indicatorId}.{geoUnit}.A',
      which is UIS's own vocabulary with no translation applied. obs_date is period-START (Jan 1) — this source's existing
      convention across all 278,720 stored observations, left unchanged.
    rate_note: 35 requests total (one per published indicator), no key, polite UA, 300s timeout. A failed indicator is
      recorded and skipped; more than half failing raises TransientError rather than merging a partial library.
    key_env: none
    confidence: high
    proof: Measured before wiring — all 35 published indicators resolve upstream, 0 fetch failures, and the rebuilt ids
      reproduce 7,043 of 7,080 published series (99.48%, against a 95% floor enforced in the fetcher). Upstream carries
      329,921 obs running to 2025 against our 278,720 frozen at 2022. The 37 published ids with no upstream match are
      retired there (e.g. VAT, ZZA) and survive via the never-shrink merge.
  keys_or_blockers:
  - NONE. No API key. Public UIS REST API at api.uis.unesco.org/api/public.
  storage_layout:
  - 'single parquet: data/clean_full/unesco_dem/unesco_dem.parquet. Schema: series_key (string), obs_date date32
    (period-START), value float64.'
