  - jobs/ingest_statcan.py
  strategy: extend_by_date
  strategy_reason: 'Genuine server-side date-tail (S2), not a whole-cube re-download. getFullTableDownloadCSV (the bulk path)
    is full-table only, BUT WDS exposes a true delta keyed on the SAME vector ids already on disk: getChangedCubeList(date)
    is a cheap change-feed of changed productIds, and getBulkVectorDataByRange(vectorIds, startDataPointReleaseDate, end)
    returns only the datapoints (new periods AND revisions) released in the window per vector. The fetcher reads each changed
    cube''s on-disk vectors + (geo,uom,coordinate) constants, pulls the release-dated tail, and merges (dedup (series_key,obs_date),
    new value wins, never-shrink). Emitted series_key = lowercase ''v''+vectorId — byte-identical to the bulk parquet — so
    merges EXTEND existing cubes, never duplicate. Implemented at updater/strategies/fetchers/statcan.py.'
  cadence: weekly
  refresh_cost: giant
  out_dir: statcan
  review: true
  adapter:
    vintage_signal: StatCan WDS getChangedCubeList(<last_success_date>) change-feed (alternatively each cube's releaseTime
      from getAllCubesListLite) to select only cubes changed since last run; getAllCubesListLite is already re-enumerated
      each run so new cubes are caught.
    since_param: n/a (S4 uses the getChangedCubeList change-feed to pick whole cubes to re-pull; for true intra-cube obs delta
      the alternative would be getBulkVectorDataByRange startRefPeriod=max stored obs_date, but base strategy is whole-changed-cube).
    out_paths_note: per-cube files data/clean_full/statcan/<productId>.parquet (~8,207 cubes) plus _manifest.jsonl, _errors.log,
      _sizecache.json, _tmp/ staging and .done/.fail markers — one file per cube; S4 clears the .done marker for each changed
      cube only.
    rate_note: 'No API key; polite UA; WDS soft limit ~25 req/s/IP; self-limits via SizeAwareGate (4 concurrent small, 1 exclusive
      large) + heavy-parse semaphore. SANDBOX HAZARD: concurrent large (>8MB) streaming downloads get the process killed by
      IO watchdog (hence exclusive large lane). Flags: --workers 1-6 (default 6), --budget, --presize, --dry.'
    key_env: none
    confidence: high
    open_question: .fail markers permanently suppress retries (404/BadZip/no-table) so a cube that later becomes available
      stays skipped until .fail is deleted — should the change-feed driven refresh also clear stale .fail markers for changed
      cubes?
  matrix:
    refresh_mechanism:
    - skip-if-series-exists
    force_refresh_procedure:
    - 'Clear markers+outputs then full run. PowerShell: `Remove-Item D:\research\econfindatalibrary\data\clean_full\statcan\*.done,
      D:\research\econfindatalibrary\data\clean_full\statcan\*.fail, D:\research\econfindatalibrary\data\clean_full\statcan\*.parquet,
      D:\research\econfindatalibrary\data\clean_full\statcan\_sizecache.json -Force` then `python.exe D:\research\econfindatalibrary\jobs\ingest_statcan.py`.
      To refresh ONE cube delete just {pid}.done/.fail/.parquet. Flags: --workers N (1-6, default 6), --budget SECONDS, --presize,
      --dry N.'
    incremental_path:
    - 'IMPLEMENTED (S2 extend_by_date) at updater/strategies/fetchers/statcan.py. getFullTableDownloadCSV is full-table only,
      so the delta uses the WDS vector endpoints instead: (1) getChangedCubeList(<watermark>) is the cheap change-feed of
      changed productIds; (2) for each changed cube WITH an on-disk parquet, read its distinct vectors + per-vector (geo,uom,coordinate)
      from disk and pull getBulkVectorDataByRange(vectorIds, startDataPointReleaseDate=<watermark>, end=today) — release-dated,
      so it returns both new periods and revisions; (3) build rows in the exact 7-col on-disk schema (series_key=''v''+vectorId,
      status=''..'' iff value null) and merge.merge_and_write (dedup (series_key,obs_date), new value wins, never-shrink). A
