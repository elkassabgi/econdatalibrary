      1 large exclusive) + a global heavy-parse semaphore. Code notes a SANDBOX HAZARD: concurrent large (>8MB) streaming
      downloads get the process killed by the IO watchdog, hence the exclusive large lane.'
    storage_layout:
    - 'per-series files: one zstd parquet per productId (~8,207 cubes, .done markers present), columns series_key(VECTOR),
