- source_id: zillow
  live: true
  scripts:
  - jobs/ingest_zillow.py
  strategy: bulk_snapshot_if_changed
  strategy_reason: Each of ~208 Zillow cubes is a whole-history wide CSV with NO per-period date param; gate per CSV on its
    HTTP validator and rebuild only changed cubes. The stale-raw-cache bug this entry warned about is handled - the fetcher
    passes cache_raw=False, because fetch_csv_text returns the cached raw copy when one exists and would otherwise re-parse
    the same bytes forever while reporting success.
  upstream_verified: 2026-07-30 - 208 CSVs discovered LIVE from the research page (not the cached list); validators measured
    STABLE (two HEADs 25s apart returned identical ETag/Last-Modified/Content-Length on three files, e.g. Metro_zhvi ETag
    "fcde3e8e9a6fca03f6f3d30a53c663e5"), unlike fed_board and bis where they are not; two-run test published 15,990 rows then
    reported unchanged/no_change.
  cadence: monthly
  refresh_cost: large
  out_dir: zillow
  review: true
  adapter:
    vintage_signal: 'Per-CSV HTTP conditional GET (If-Modified-Since/ETag) or Last-Modified vs stored mtime; plus catalog
      re-enumeration via --refresh (re-scrapes the research page ''var data'' object into _zillow_files.json) to detect NEW
      datasets. CRITICAL: today fetch_csv_text() returns the cached RAW copy if present, so re-runs reparse STALE CSVs — caching
      must be removed or made conditional.'
    since_param: n/a
    out_paths_note: '~206 grouped cubes under data/clean_full/zillow/: <name>.parquet + <name>__series.parquet sidecar + <name>.meta.json,
      plus top-level zillow.meta.json; catalog in data/_zillow_files.json; raw CSVs cached in data/raw/zillow/ (~107M obs
      total) — writes to multiple files/sidecars per dataset.'
    rate_note: No key, polite UA, requests Session Retry (total=6, backoff 1.5, forcelist 429/5xx) + per-call 5-attempt loop,
      300s timeout. Optional --catalog upserts into catalog.db (off by default).
    key_env: none
    confidence: high
    open_question: 'Headline correctness bug: scheduled re-runs silently reuse cached raw CSVs and write ''fresh'' cubes with
      no new months — fix by deleting/conditional-GET''ing the raw cache before this strategy can detect change reliably.
      Page redesign of the ''var data'' object would break catalog enumeration.'
  matrix:
    refresh_mechanism:
    - overwrite-multi-file
    force_refresh_procedure:
    - 'Clear the raw CSV cache (otherwise stale cached CSVs are reused — fetch_csv_text line 338), then run with --refresh
      to also re-enumerate the catalog: `rm -rf D:/research/econfindatalibrary/data/raw/zillow/*` && `python.exe jobs/ingest_zillow.py
      --refresh`. (--refresh alone re-scrapes the page but still reuses cached CSVs; deleting RAW is what forces fresh downloads.
      Output cubes in data/clean_full/zillow are overwritten unconditionally, no clearing needed.)'
    incremental_path:
    - Per-CSV delta is not exposed by Zillow (each CSV is full wide history). True since=last_obs would require, per cube,
      reading the existing parquet's max obs_date and only appending newly-present YYYY-MM-DD columns from the freshly downloaded
      CSV — but you must download the full CSV anyway, so the only saving is parse/write, not bandwidth. The genuine fix for
      correctness is to stop caching (or add an HTTP conditional GET / mtime check) so re-runs actually fetch updated CSVs.
    keys_or_blockers:
    - No key. Polite UA. requests Session with Retry (total=6, backoff 1.5, forcelist 429/5xx) + per-call 5-attempt loop,
      300s timeout. Optional --catalog upserts into catalog.db (off by default). Page-scrape depends on the 'var data' JS
      object structure — a Zillow page redesign breaks enumeration.
    storage_layout:
    - '~206 grouped ''cubes'' under data/clean_full/zillow/: per dataset <name>.parquet (dataset, series_key, obs_date date32,
      value), <name>__series.parquet sidecar (RegionID + all metadata cols), <name>.meta.json (verify stats); plus top-level
      zillow.meta.json. Catalog of URLs in data/_zillow_files.json; raw CSVs cached in data/raw/zillow/. ~107M obs total.'

# ---------------------------------------------------------------------------
# IMF DIRECT (api.imf.org SDMX 2.1) — first-hand, replacing nothing.
  #
# 37.4% of this library (635,750 series) reaches us via DBnomics, an aggregator,
# which makes our freshness a function of theirs. These seven pull the same IMF
# datasets straight from the publisher. Verified 2026-07-28 to return at least as
# much as the relay does (FAS ~2x our series, WORLD +43%, FDI exact, AFRREO ~100%).
  #
# They are NEW ids, not replacements. IMF retired IFS and re-keyed these datasets,
# so the crosswalk from our DBnomics-era ids is uneven (FDI 95.3% via codelist
# names, APDREO 100% by code, WHDREO 56%, FAS/WORLD/COFER ~0% — COFER moved
# currency out of the indicator string into its own dimension). Overwriting
# imf_<flow> would re-key thousands of live series to buy freshness; this adds the
# direct feed alongside and leaves that retirement a deliberate decision.
  #
# MCDREO (direct has 57% of our series) and FM (9%) are deliberately NOT here
# until that shortfall is explained — shipping a source thinner than the one next
# to it would be a regression wearing a "direct" label.
# ---------------------------------------------------------------------------
- source_id: imf_fdi_direct
  live: true
  scripts:
  - jobs/ingest_imf_direct.py
  strategy: bulk_snapshot_if_changed
  strategy_reason: >-
    IMF republishes whole datasets and ships dated vintages
    (BOP_2026_MAY_VINTAGE), so the honest change signal is the dataflow's own
    published version, not a date-tail probe — a back-revision rewrites history
    without extending it and a date probe would miss it entirely.
  cadence: annual
  refresh_cost: fast
  out_dir: imf_fdi_direct
  review: true
  adapter:
    vintage_signal: >-
      GET {BASE}/dataflow and read the version attribute of dataflow FDI
      (agency IMF.MCM); re-pull only when it moves. Agency ids are NOT uniform
      across IMF datasets — read them from the catalogue, never assume IMF.STA.
    name: Financial Development Index (FDI)
