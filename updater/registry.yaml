    to the 3-char on-disk code via the /v2/country reference list, keeping series_key WDI:{ind}:{ctry} identical.'
  cadence: quarterly
  refresh_cost: medium
  out_dir: worldbank_wdi
  review: true
  adapter:
    vintage_signal: 'No cheap probe needed for date-tail: the v2 date filter makes the trailing pull cheap, so
      extend_by_date always attempts the small recent window and the fetcher returns no_change when 0 new rows
      land. (The WDI database vintage is exposed as meta.lastupdated, e.g. 2026-04-08, if a gate is ever wanted.)'
    since_param: 'date=YYYY:YYYY on /v2/country/all/indicator/{code} (server-side year-range filter); start =
      stored max obs year - 2 (back-revision lookback), end = current year + 1.'
    out_paths_note: Single zstd parquet data/clean_full/worldbank_wdi/worldbank_wdi.parquet (~60 MB, ~8.9M obs, series_key
      'WDI:{ind}:{ctry}'). Written in 1M-row batches to ONE file (no actual file-splitting despite a commented >100M intent).
    rate_note: No key, polite UA, 300s timeout, 3 retries, two candidate URLs; rejects responses <100KB (api.worldbank.org
      bulk endpoint is occasionally flaky, hence the databank fallback).
    key_env: none
    confidence: high
    open_question: A prior truncated/partial parquet is trusted forever by the skip-if-exists guard (only a row-count sanity,
      no integrity check) — add a vintage/row-count assertion so a bad parquet is rebuilt.
  matrix:
    refresh_mechanism:
    - skip-if-series-exists
    force_refresh_procedure:
    - 'Delete the parquet first (main() no-ops on line 82 `if os.path.exists(out_path)`), then run: `rm D:/research/econfindatalibrary/data/clean_full/worldbank_wdi/worldbank_wdi.parquet`
      && `python.exe jobs/ingest_worldbank_wdi.py`. It re-downloads WDI_CSV.zip (~tens of MB) from api.worldbank.org (falls
      back to databank.worldbank.org) and rebuilds the single parquet.'
    incremental_path:
    - 'Not feasible from the bulk CSV (it is whole-history wide CSV, no since param). True delta would mean switching from
      the bulk zip to the per-indicator v2 API with `&date=lastyear:thisyear` or `mrv=N`, then merge into the existing parquet
      — a substantial rewrite changing the data source. Simpler: keep full bulk re-download (it''s already a single ~60MB
      parquet, medium cost).'
    keys_or_blockers:
    - No key. Polite UA. 300s timeout, 3 retries, two candidate URLs (api.worldbank.org indicator?downloadformat=csv, then
      databank.worldbank.org/data/download/WDI_CSV.zip). Rejects responses <100KB. The api.worldbank.org bulk endpoint is
      occasionally flaky — hence the fallback URL.
    storage_layout:
    - single zstd parquet data/clean_full/worldbank_wdi/worldbank_wdi.parquet (~60 MB, ~8.9M obs), schema (series_key 'WDI:{ind}:{ctry}',
      obs_date date32 year-end, value float64). Written via ParquetWriter in 1M-row batches to one file. Code has a commented
      intent to split if >100M rows but BATCH only chunks writes, never splits files.
