    SDMX path (ingest_bis_full.py) could do sdmx_delta via startPeriod but degrades to per-flow re-pull and both scripts write
    to the same dir - bulk_snapshot is the binding strategy for the source.'
  cadence: monthly
  refresh_cost: medium
  out_dir: bis
  review: true
  adapter:
    vintage_signal: 'HTTP HEAD Last-Modified / Content-Length on the two bulk zip URLs (data.bis.org CBS.zip & LBS.zip) -
      the zips ARE dated upstream but the code reads no date today. Replace the >10000-byte download skip and the out_path-exists
      ingest no-op with a HEAD-gated re-download. (SDMX path ingest_bis_full.py: optional startPeriod=<last_year> on /data/{flow},
      but BIS exposes no clean per-flow vintage so it degrades to full re-pull.)'
    since_param: n/a for bulk CBS/LBS (no date param); SDMX path would use startPeriod=<last_obs_year> on /data/{flow}
    out_paths_note: 'Multi-file AND multi-script collision: ingest_bis_cbs_lbs.py writes data/clean_full/bis/CBS.parquet (37.5MB)
      & LBS.parquet (183MB) with raw zips cached in data/raw/bis_bulk; ingest_bis_full.py writes WS_*.parquet (giants chunked
