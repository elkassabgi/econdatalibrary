<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signing in…</title>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:#0f1729;color:#9ca3af}
  .m{text-align:center}
  .m strong{color:#d4a843}
  .m a{color:#d4a843}
  .ret{margin-top:.6rem;font-size:.85rem}
</style>
</head>
<body>
  <div class="m"><p><strong>ElkassabgiData</strong><br>Completing sign-in…</p><p class="ret"><a href="/">Return to the site</a></p></div>
  <script>
  (function () {
    'use strict';
    var ACCOUNTS = 'https://accounts.elkassabgidata.com';
    var SS = { v: 'ekd_silent_v', s: 'ekd_silent_s', r: 'ekd_silent_r', done: 'ekd_silent_done' };
    function ss(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
    function ssSet(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
    function ssDel(k){ try { sessionStorage.removeItem(k); } catch(e){} }
    function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
    function safeReturn(u){ if (typeof u!=='string'||u.charAt(0)!=='/'||u.charAt(1)==='/') return '/'; return u; }
    var hasOpener = false;
    try { hasOpener = !!(window.opener && !window.opener.closed); } catch(e) {}
    if (!hasOpener) {
      var q, code, state, err;
      try { q = new URLSearchParams(location.hash.slice(1)); } catch(e) { q = new URLSearchParams(''); }
      code = q.get('code') || ''; state = q.get('state') || ''; err = q.get('error') || '';
      try { history.replaceState(null,'',location.pathname); } catch(e) {}
      // Spend the attempt BEFORE anything can fail, as a timestamp so the bouncer
      // can re-arm it once stale. Any path leaving it unset is a redirect loop.
      ssSet(SS.done, String(Date.now()));
      var back = function () {
        var dest = safeReturn(ss(SS.r) || '/');
        ssDel(SS.v); ssDel(SS.s); ssDel(SS.r);
        try { location.replace(dest); } catch(e) { location.href = dest; }
      };
      if (err || !code) { back(); return; }
      var ver = ss(SS.v), want = ss(SS.s);
      if (!ver || !want || state !== want) { back(); return; }
      fetch(ACCOUNTS + '/token/exchange', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, code_verifier: ver, client_origin: location.origin })
      }).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if (!d || !d.access_token) return null;
          if (d.refresh_token) lsSet('ekd_rt', d.refresh_token);
          lsSet('ekd_at', JSON.stringify({ t: d.access_token, e: Date.now() + (Number(d.expires_in||900)*1000) }));
        }).catch(function(){}).then(back);
      return;
    }
  })();
  </script>
  <script>
  (function () {
    // The IdP 303'd here with the family code + state in the URL FRAGMENT (never
    // sent to any server). Hand it back to the opener (same origin) and close.
    try {
      var p = new URLSearchParams(location.hash.slice(1));
      var msg = { type: 'ekd_auth', code: p.get('code') || '', state: p.get('state') || '' };
      // Strip the code from the address bar / history immediately.
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      var delivered = false;
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(msg, location.origin); // same-origin only
          delivered = true;
        }
      } catch (e) {}
      // Fallback for opener-less contexts (e.g. COOP): same-origin BroadcastChannel.
      if (!delivered && 'BroadcastChannel' in window) {
        try { var bc = new BroadcastChannel('ekd_auth'); bc.postMessage(msg); bc.close(); } catch (e) {}
      }
    } catch (e) {}
    setTimeout(function () { try { window.close(); } catch (e) {} }, 200);
  })();
  </script>
</body>
</html>
